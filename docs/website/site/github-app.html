<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Continue to GitHub · Verity</title>
    <link rel="icon" href="/assets/verity-favicon.png" />
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #06030d; color: #f7f3ff; padding: 24px; }
      main { width: min(560px, 100%); padding: 32px; border: 1px solid #35274d; border-radius: 24px; background: #120b1c; box-sizing: border-box; }
      img { width: 44px; height: 44px; }
      h1 { margin: 20px 0 12px; font-size: 32px; }
      p { color: #c8bdd7; line-height: 1.55; }
      button { margin-top: 16px; min-height: 48px; border: 0; border-radius: 999px; padding: 0 24px; background: #ff35ce; color: #100817; font: inherit; font-weight: 800; cursor: pointer; }
      [hidden] { display: none; }
    </style>
    <script type="module" src="/github/app/github-app.js"></script>
  </head>
  <body>
    <main>
      <img src="/assets/verity-mark.png" alt="" />
      <h1>Continue to GitHub</h1>
      <p id="status">Checking the one-time request from the Verity app…</p>
      <form id="github-form" method="post" hidden>
        <input id="manifest" name="manifest" type="hidden" />
        <button type="submit">Continue to GitHub</button>
      </form>
    </main>
  </body>
</html>
