# Clang modules require direct and depend modes; without these the cache
# silently stores no objects for React Native pods. Keep other checks strict.
max_size = 512MiB
compiler_check = content
# Xcode's generated Swift header overlay lives at a different temporary path
# per build. Source/header content and compiler identity remain checked.
sloppiness = modules,ivfsoverlay
direct_mode = true
depend_mode = true
