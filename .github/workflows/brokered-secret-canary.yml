name: verity-brokered-secret-canary

on:
  workflow_dispatch: {}
  schedule:
    # Exercise the production secret path often enough to catch an outage without
    # turning a diagnostic build into a large GitHub-hosted runner bill.
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: brokered-secret-canary
  cancel-in-progress: false

jobs:
  production-path:
    # The canary deliberately exercises the root-owned production broker. A throwaway VM bounds
    # both sudo and synthetic-secret exposure instead of granting either on a deployment runner.
    runs-on: ubuntu-24.04
    environment: secret-canary
    timeout-minutes: 10
    steps:
      - name: Validate dedicated canary configuration
        env:
          VERITY_SECRET_CANARY_DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          VERITY_SECRET_CANARY_DOPPLER_PROJECT: ${{ vars.DOPPLER_PROJECT }}
          VERITY_SECRET_CANARY_DOPPLER_CONFIG: ${{ vars.DOPPLER_CONFIG }}
          VERITY_SECRET_CANARY_ALIAS: ${{ vars.SECRET_ALIAS }}
          VERITY_SECRET_CANARY_SHA256: ${{ vars.SECRET_SHA256 }}
        run: |
          status=0
          for name in \
            VERITY_SECRET_CANARY_DOPPLER_TOKEN \
            VERITY_SECRET_CANARY_DOPPLER_PROJECT \
            VERITY_SECRET_CANARY_DOPPLER_CONFIG \
            VERITY_SECRET_CANARY_ALIAS \
            VERITY_SECRET_CANARY_SHA256; do
            if [ -z "${!name:-}" ]; then
              echo "::error::secret-canary environment is missing $name"
              status=1
            fi
          done
          exit "$status"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.19.0'
      - name: Build production resolver path
        run: |
          npm ci --workspace @verity/server --include-workspace-root --ignore-scripts
          npm run build --workspace @verity/server
      - name: Verify HTTP, env, file, and parallel secret resolution by hash
        env:
          VERITY_SECRET_CANARY_DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          VERITY_SECRET_CANARY_DOPPLER_PROJECT: ${{ vars.DOPPLER_PROJECT }}
          VERITY_SECRET_CANARY_DOPPLER_CONFIG: ${{ vars.DOPPLER_CONFIG }}
          VERITY_SECRET_CANARY_ALIAS: ${{ vars.SECRET_ALIAS }}
          VERITY_SECRET_CANARY_SHA256: ${{ vars.SECRET_SHA256 }}
        run: sudo --preserve-env node packages/server/dist/doppler-secret-canary-smoke.js
