name: verity-mobile-production-build

on:
  workflow_dispatch:
    inputs:
      mobile-tag:
        description: Immutable mobile-vX.Y.0 release to prepare for production
        required: true
        type: string
      production-run-id:
        description: Existing production build run to finalize without rebuilding or uploading
        required: false
        type: string

# Apple build counters and the shared promotion branch must remain serialized.
# This lock never holds the staging release train.
concurrency:
  group: mobile-production-build
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-mobile-native:
    if: inputs.production-run-id == ''
    uses: ./.github/workflows/mobile-native-build.yml
    secrets: inherit
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    with:
      mobile-tag: ${{ inputs.mobile-tag }}
      variant: production

  finalize-mobile-production:
    needs: publish-mobile-native
    if: >-
      always() && (needs.publish-mobile-native.result == 'success' ||
      (needs.publish-mobile-native.result == 'skipped' && inputs.production-run-id != ''))
    runs-on: ubuntu-26.04
    timeout-minutes: 130
    # The production proposal (branch push, signed commit, PR, approval
    # dismissals) is written with the release app token so the promotion PR
    # triggers pull_request CI. GITHUB_TOKEN reads the release, this run's
    # artifact and the recovery run's provenance.
    permissions:
      actions: read
      contents: read
    env:
      MOBILE_TAG: ${{ inputs.mobile-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
      - name: Verify recovery build provenance
        if: inputs.production-run-id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PRODUCTION_RUN_ID: ${{ inputs.production-run-id }}
        run: |
          set -euo pipefail
          [[ "$PRODUCTION_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/${GH_REPO}/actions/runs/${PRODUCTION_RUN_ID}" --jq \
            '.path == ".github/workflows/mobile-production-build.yml" and .event == "workflow_dispatch" and .head_branch == "main"' | grep -qx true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-production-${{ env.MOBILE_TAG }}
          path: native-candidates
          run-id: ${{ inputs.production-run-id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for verified staging publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 240); do
            # This read-only token cannot see the release while it is a draft.
            if state="$(gh release view "$MOBILE_TAG" --json isDraft,assets)" &&
              jq -e '.isDraft == false and any(.assets[]; .name == "native-staging.json")' <<< "$state" >/dev/null; then
              gh release download "$MOBILE_TAG" --pattern native-staging.json --output "$RUNNER_TEMP/native-staging.json" --clobber
              jq -e --slurpfile staging "$RUNNER_TEMP/native-staging.json" \
                '.source == $staging[0].source and .version == $staging[0].version and .product == "mobile-native" and .appId != $staging[0].appId' \
                native-candidates/native-production.json >/dev/null
              exit 0
            fi
            sleep 30
          done
          echo '::error::Staging has not published; retry this job after staging recovery.'
          exit 1

      # Installation tokens expire after an hour and the wait above can take
      # two, so mint right before the only step that writes.
      - name: Mint release app token
        id: app-token
        # renovate: datasource=github-actions depName=actions/create-github-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Open native production approval
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_BOT_LOGINS: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          set -euo pipefail
          # The proposer pushes the promotion branch through `origin`.
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$basic"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $basic"
          version="${MOBILE_TAG#mobile-v}"
          pr="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=closed&per_page=100" --jq '.[] | select(.merged_at != null and (.title == "chore(main): release mobile '"$version"'" or .title == "chore(release): staging mobile native '"$version"'")) | .number')"
          [[ "$pr" =~ ^[0-9]+$ ]]
          jq --argjson releasePr "$pr" '. + {releasePr:$releasePr}' native-candidates/native-production.json > "$RUNNER_TEMP/mobile-production.json"
          node scripts/production-promotion.ts propose "$RUNNER_TEMP/mobile-production.json"
