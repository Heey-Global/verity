name: verity-server-production-promote
on:
  push:
    branches: [main]
    paths: [releases/server-production.json]
  workflow_dispatch:
    inputs:
      recovery-candidate:
        description: Expected approved manifest hash for automatic recovery
        type: string
        default: ''
      recovery-pipeline:
        description: Expected promotion pipeline hash for automatic recovery
        type: string
        default: ''
permissions: read-all
concurrency:
  group: release-backend
  queue: max
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      actions: write
      pull-requests: write
      issues: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'

      - name: Verify recovery checkout
        id: recovery
        env:
          RECOVERY_CANDIDATE: ${{ inputs.recovery-candidate || '' }}
          RECOVERY_PIPELINE: ${{ inputs.recovery-pipeline || '' }}
        run: node scripts/promotion-recovery.mjs server
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Promote reviewed Server candidate
        id: deliver
        if: steps.recovery.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username '${{ github.actor }}' --password-stdin
          node scripts/production-promotion.ts promote

      # Step names persist on GitHub even if a publisher failed after preflight.
      - name: recovery-v1:${{ steps.recovery.outputs.candidate }}:${{ steps.recovery.outputs.pipeline }}:${{ steps.recovery.outputs.ready != 'true' && 'skipped' || steps.deliver.outputs.deferred == 'true' && 'deferred' || job.status == 'cancelled' && 'cancelled' || steps.deliver.outcome == 'success' && 'success' || 'failure' }}
        if: always() && steps.recovery.outcome == 'success'
        run: echo 'Promotion recovery receipt recorded.'
