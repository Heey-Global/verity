name: verity-secret-job-worker

on:
  pull_request:
    paths:
      - 'packages/server/src/secret-*'
      - 'packages/server/src/brokered-secret-job-executor*'
      - 'packages/server/src/docker*'
      - 'packages/server/src/gvisor-runtime-config*'
      - 'packages/secret-contracts/**'
      - 'deploy/secret-job-worker.Dockerfile'
      - 'deploy/gvisor-ci.Dockerfile'
      - 'deploy/bin/verity-secret-job-worker-smoke'
      - 'deploy/bin/verity-secret-job-live-smoke'
      - 'deploy/bin/verity-secret-job-fake-pilot'
      - 'deploy/bin/verity-secret-job-worker'
      - 'deploy/bin/verity-gvisor-smoke'
      - 'deploy/bin/verity-install'
      - 'deploy/bin/verity-install.test.mjs'
      - 'deploy/gvisor/install-runsc-host.sh'
      - 'deploy/gvisor/versions.env'
      - '.dockerignore'
      - '.github/workflows/secret-job-worker.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.base.json'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: secret-job-worker-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  architecture-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERITY_GVISOR_DIND: verity-gvisor-dind-${{ github.run_id }}-${{ github.run_attempt }}
      VERITY_GVISOR_DIND_IMAGE: verity-gvisor-dind:ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Start isolated Docker/gVisor daemon
        run: |
          set -euo pipefail
          docker build --file deploy/gvisor-ci.Dockerfile --tag "$VERITY_GVISOR_DIND_IMAGE" .
          socket_dir="$RUNNER_TEMP/$VERITY_GVISOR_DIND"
          socket_path="$socket_dir/docker.sock"
          mkdir -p "$socket_dir"
          docker run --detach --privileged \
            --name "$VERITY_GVISOR_DIND" \
            --volume "$socket_dir:/run/verity-dind" \
            --env DOCKER_TLS_CERTDIR= \
            "$VERITY_GVISOR_DIND_IMAGE" \
            --host=unix:///var/run/docker.sock \
            --host=unix:///run/verity-dind/docker.sock
          for attempt in $(seq 1 60); do
            if docker exec "$VERITY_GVISOR_DIND" docker info >/dev/null 2>&1; then
              docker exec "$VERITY_GVISOR_DIND" chmod 0666 /run/verity-dind/docker.sock
              printf 'DOCKER_HOST=unix://%s\n' "$socket_path" >>"$GITHUB_ENV"
              printf 'VERITY_SECRET_JOB_DOCKER_BASE_URL=unix://%s\n' "$socket_path" >>"$GITHUB_ENV"
              exit 0
            fi
            if [[ "$attempt" -eq 60 ]]; then
              docker logs "$VERITY_GVISOR_DIND" >&2 || true
              exit 1
            fi
            sleep 0.25
          done
      - name: Build worker image
        run: |
          docker build \
            --file deploy/secret-job-worker.Dockerfile \
            --tag verity-secret-job-worker:base \
            .
      - name: Build fake pilot image
        run: |
          docker build \
            --file deploy/secret-job-worker.Dockerfile \
            --target fake-pilot \
            --tag verity-secret-job-fake-pilot:smoke \
            .
      - name: Verify fixed entrypoint and confinement
        run: deploy/bin/verity-secret-job-worker-smoke verity-secret-job-worker:base
      - name: Build host-side live harness
        run: |
          # The harness is packages/server/dist/secret-job-live-smoke.js; the
          # server project references are its complete build closure.
          npm ci --workspace @verity/server --include-workspace-root --ignore-scripts
          npm run build --workspace @verity/server
      - name: Run live Docker/gVisor fake-secret round trip
        run: deploy/bin/verity-secret-job-live-smoke verity-secret-job-fake-pilot:smoke
      - name: Remove smoke image
        if: always()
        run: |
          if [[ ${DOCKER_HOST:-} == unix://* && -S ${DOCKER_HOST#unix://} ]]; then
            docker --host "$DOCKER_HOST" image rm -f \
              verity-secret-job-fake-pilot:smoke \
              verity-secret-job-worker:base >/dev/null 2>&1 || true
          fi
          docker --host unix:///var/run/docker.sock exec "$VERITY_GVISOR_DIND" \
            rm -f /run/verity-dind/docker.sock >/dev/null 2>&1 || true
          docker --host unix:///var/run/docker.sock rm -f "$VERITY_GVISOR_DIND" >/dev/null 2>&1 || true
          docker --host unix:///var/run/docker.sock image rm -f "$VERITY_GVISOR_DIND_IMAGE" >/dev/null 2>&1 || true

  # Preserve the original required-check name while the work runs as a matrix.
  image-smoke:
    if: ${{ always() }}
    needs: architecture-smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Require every architecture smoke to pass
        env:
          ARCHITECTURE_SMOKE_RESULT: ${{ needs.architecture-smoke.result }}
        run: test "$ARCHITECTURE_SMOKE_RESULT" = success
