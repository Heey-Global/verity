name: verity-mobile-production-promote
on:
  push:
    branches: [main]
    paths: [releases/mobile-production.json]
  workflow_dispatch:
permissions: read-all
concurrency:
  group: mobile-production-build
  queue: max
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
      actions: write
      pull-requests: write
      issues: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Upload approved production binary to TestFlight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: node scripts/production-promotion.ts promote-native
