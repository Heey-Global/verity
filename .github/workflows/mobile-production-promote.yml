name: verity-mobile-production-promote
on:
  push:
    branches: [main]
    paths: [releases/mobile-production.json]
  workflow_dispatch:
    inputs:
      recovery-candidate:
        description: Expected approved manifest hash for automatic recovery
        type: string
        default: ''
      recovery-pipeline:
        description: Expected promotion pipeline hash for automatic recovery
        type: string
        default: ''
permissions: read-all
concurrency:
  group: mobile-production-build
  queue: max
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
      actions: write
      pull-requests: write
      issues: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'

      - name: Verify recovery checkout
        id: recovery
        env:
          RECOVERY_CANDIDATE: ${{ inputs.recovery-candidate || '' }}
          RECOVERY_PIPELINE: ${{ inputs.recovery-pipeline || '' }}
        run: node scripts/promotion-recovery.mjs native
      - name: Upload approved production binary to TestFlight
        id: deliver
        if: steps.recovery.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: node scripts/production-promotion.ts promote-native

      # Step names persist on GitHub even if a publisher failed after preflight.
      - name: recovery-v1:${{ steps.recovery.outputs.candidate }}:${{ steps.recovery.outputs.pipeline }}:${{ steps.recovery.outputs.ready != 'true' && 'skipped' || steps.deliver.outputs.deferred == 'true' && 'deferred' || job.status == 'cancelled' && 'cancelled' || steps.deliver.outcome == 'success' && 'success' || 'failure' }}
        if: always() && steps.recovery.outcome == 'success'
        run: echo 'Promotion recovery receipt recorded.'
