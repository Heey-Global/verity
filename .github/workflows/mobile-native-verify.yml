name: verity-mobile-native-verify

# Non-publishing. Mobile pull requests and manual refs compile on a GitHub-hosted
# macOS runner, so native changes are tested before their release PR is merged.
on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/mobile/**'
      - 'packages/events/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/patch-mobile-native-deps.mjs'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to compile
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-native-verify-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify-ios:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      # renovate: datasource=github-actions depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      # renovate: datasource=github-actions depName=actions/setup-node
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.19.0'

      - name: Install and verify the mobile sources
        run: |
          set -euo pipefail
          npm ci
          npm run -w @verity/mobile-app patch:native
          npm run -w @verity/mobile build
          npm run -w @verity/mobile-app typecheck

      - name: Generate the iOS project
        working-directory: apps/mobile
        env:
          GOOGLE_AUTH_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Compile the iOS simulator app
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          scheme=Verity
          xcodebuild -workspace "$workspace" -list -json \
            | ruby -rjson -e 'schemes=JSON.parse(STDIN.read).dig("workspace", "schemes") || []; abort "missing #{ARGV[0]} scheme" unless schemes.include?(ARGV[0])' "$scheme"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
