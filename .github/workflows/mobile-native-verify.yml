name: verity-mobile-native-verify

# Non-publishing. Mobile pull requests and manual refs compile on a GitHub-hosted
# macOS runner, so native changes are tested before their release PR is merged.
on:
  pull_request:
    paths:
      # JavaScript/TypeScript screens, components and tests are OTA-safe and are
      # already covered by the Linux mobile-app job. Reserve the scarce macOS
      # runner for inputs that can change the generated native project or binary.
      - '.github/workflows/mobile-native-verify.yml'
      - 'apps/mobile/app.config.ts'
      - 'apps/mobile/android/**'
      - 'apps/mobile/assets/**'
      - 'apps/mobile/eas.json'
      - 'apps/mobile/ios/**'
      - 'apps/mobile/native/**'
      - 'apps/mobile/package.json'
      - 'apps/mobile/patches/**'
      - 'apps/mobile/plugins/**'
      # OTA promotion only moves an already-published EAS branch. It neither
      # changes nor rebuilds the native app.
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/mobile-native-lock-changes.mjs'
      - 'scripts/patch-mobile-native-deps.mjs'
      - 'scripts/ios-pinned-tls-smoke.sh'
      - 'scripts/ios-pinned-tls-smoke.swift'
      - 'scripts/ios-pinned-tls-smoke-app.swift'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to compile
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-native-verify-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.native.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - id: native
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          native_sources="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/mobile-native-verify\.yml|package-lock\.json|scripts/mobile-native-lock-changes\.mjs)$' || true)"
          if [ -n "$native_sources" ]; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -Fxq 'package-lock.json' <<< "$changed"; then
            echo 'required=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          native_changes="$(node scripts/mobile-native-lock-changes.mjs "$BASE_SHA" HEAD)"
          if [ -n "$native_changes" ]; then
            printf '%s\n' "$native_changes"
            echo 'required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'required=false' >> "$GITHUB_OUTPUT"
          fi

  verify-ios:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      # renovate: datasource=github-actions depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      # renovate: datasource=github-actions depName=actions/setup-node
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.19.0'

      - name: Install and verify the mobile sources
        run: |
          set -euo pipefail
          npm ci
          npm run -w @verity/mobile-app patch:native
          npm run -w @verity/mobile build
          npm run -w @verity/mobile-app typecheck

      - name: Generate the iOS project
        working-directory: apps/mobile
        env:
          GOOGLE_AUTH_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: npx expo prebuild --platform ios --no-install --clean

      # Runs after prebuild: the harness reads the App Transport Security
      # dictionary out of the generated Info.plist, which is what decides
      # whether iOS keeps a pinned private-CA connection at all.
      - name: Verify pinned TLS against a self-signed server
        run: scripts/ios-pinned-tls-smoke.sh

      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Compile the iOS simulator app
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          scheme=Verity
          xcodebuild -workspace "$workspace" -list -json \
            | ruby -rjson -e 'schemes=JSON.parse(STDIN.read).dig("workspace", "schemes") || []; abort "missing #{ARGV[0]} scheme" unless schemes.include?(ARGV[0])' "$scheme"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
