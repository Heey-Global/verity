name: verity-mobile-native-verify

# Non-publishing. Native app changes compile on a GitHub-hosted macOS runner;
# fixture changes run their matching Apple probes without rebuilding the app.
on:
  pull_request:
    paths:
      # JavaScript/TypeScript screens, components and tests are OTA-safe and are
      # already covered by the Linux mobile-app job. Reserve the macOS runner
      # for native inputs and Apple-specific smoke fixtures.
      - '.github/workflows/mobile-native-verify.yml'
      - 'apps/mobile/app.config.ts'
      - 'apps/mobile/android/**'
      - 'apps/mobile/assets/**'
      - 'apps/mobile/eas.json'
      - 'apps/mobile/ios/**'
      - 'apps/mobile/native/**'
      - 'apps/mobile/package.json'
      - 'apps/mobile/patches/**'
      - 'apps/mobile/plugins/**'
      # OTA promotion only moves an already-published EAS branch. It neither
      # changes nor rebuilds the native app.
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/mobile-native-lock-changes.mjs'
      - 'scripts/mobile-native-compatibility.mjs'
      - 'scripts/prepare-mobile-eas-build.mjs'
      - 'scripts/patch-mobile-native-deps.mjs'
      - 'scripts/ios-pinned-tls-smoke.sh'
      - 'scripts/ios-pinned-tls-smoke.swift'
      - 'scripts/ios-pinned-tls-smoke-app.swift'
      - 'scripts/pinned-http-pool-smoke.swift'
      - 'scripts/*ios_pinned_tls_relay.py'
      - 'scripts/remote-control-tunnel/**'
      - 'scripts/remote-control-staging/**'
      - 'scripts/enrollment-proof/**'
      - 'docs/protocols/uplink-enrollment-v1.md'
      - 'docs/protocols/uplink-enrollment-storage-v1.md'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to compile
        required: false
        default: ''
        type: string
      uplink_origin:
        description: HTTPS origin of the Staging Uplink
        required: false
        type: string
      installation_handle:
        description: Existing installation's public routing handle
        required: false
        type: string
      core_url:
        description: Paired logical HTTPS Core URL
        required: false
        type: string
      core_pin:
        description: Paired Core SPKI pin (sha256-...)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-native-verify-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.native.outputs.required }}
      compile: ${{ steps.native.outputs.compile }}
      enrollment: ${{ steps.native.outputs.enrollment }}
      tls: ${{ steps.native.outputs.tls }}
      tunnel: ${{ steps.native.outputs.tunnel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'

      - run: npm ci

      - id: native
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != pull_request ]; then
            for check in required compile enrollment tls tunnel; do
              echo "$check=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          compile=false
          enrollment=false
          tls=false
          tunnel=false
          if ! git diff --quiet "$BASE_SHA" HEAD -- scripts/enrollment-proof \
            docs/protocols/uplink-enrollment-v1.md \
            docs/protocols/uplink-enrollment-storage-v1.md; then
            enrollment=true
          fi
          if ! git diff --quiet "$BASE_SHA" HEAD -- 'scripts/ios-pinned-tls-smoke*' scripts/pinned-http-pool-smoke.swift 'scripts/*ios_pinned_tls_relay.py'; then
            tls=true
          fi
          if ! git diff --quiet "$BASE_SHA" HEAD -- scripts/remote-control-tunnel scripts/remote-control-staging; then
            tunnel=true
          fi
          native_changes="$(node scripts/mobile-native-compatibility.mjs "$BASE_SHA" HEAD)"
          if [ -n "$native_changes" ]; then
            printf '%s\n' "$native_changes"
            compile=true
          fi
          required=false
          if [ "$compile" = true ] || [ "$enrollment" = true ] || \
            [ "$tls" = true ] || [ "$tunnel" = true ]; then
            required=true
          fi
          for check in required compile enrollment tls tunnel; do
            echo "$check=${!check}" >> "$GITHUB_OUTPUT"
          done

  verify-ios:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      # renovate: datasource=github-actions depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      # renovate: datasource=github-actions depName=actions/setup-node
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'

      - name: Install dependencies
        run: npm ci

      - name: Verify the mobile sources
        if: needs.changes.outputs.compile == 'true'
        run: |
          set -euo pipefail
          npm run -w @verity/mobile-app patch:native
          npm run -w @verity/mobile build
          npm run -w @verity/mobile-app typecheck

      - name: Typecheck native Remote Control tunnel
        if: needs.changes.outputs.compile == 'true' || needs.changes.outputs.tunnel == 'true'
        run: |
          xcrun swiftc -typecheck -parse-as-library -target "$(uname -m)-apple-macosx14.0" \
            apps/mobile/native/CertificatePinDelegate.swift \
            apps/mobile/native/RemoteSmokeTunnel.swift \
            apps/mobile/native/RemoteDataDiagnostics.swift \
            apps/mobile/native/RemoteAppTunnel.swift \
            scripts/remote-control-staging/StagingProbe.swift
          xcrun swiftc -parse-as-library apps/mobile/native/RemoteDataDiagnostics.swift \
            scripts/remote-control-tunnel/Diagnostics.swift -o "$RUNNER_TEMP/data-diagnostics-test"
          "$RUNNER_TEMP/data-diagnostics-test"

      - name: Verify enrollment reference model and macOS Keychain probe
        if: needs.changes.outputs.compile == 'true' || needs.changes.outputs.enrollment == 'true'
        timeout-minutes: 5
        run: |
          npx vitest run scripts/enrollment-proof
          bash scripts/enrollment-proof/run-apple.sh

      - name: Generate the iOS project
        if: needs.changes.outputs.compile == 'true' || needs.changes.outputs.tls == 'true' || needs.changes.outputs.tunnel == 'true'
        working-directory: apps/mobile
        env:
          GOOGLE_AUTH_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: npx expo prebuild --platform ios --no-install --clean

      # Compile before simulator probes so native errors surface without
      # waiting for several device boots and network smoke tests.
      - name: Configure native compiler cache
        if: needs.changes.outputs.compile == 'true'
        id: compiler-cache
        run: |
          set -euo pipefail
          command -v ccache >/dev/null || brew install ccache
          toolchain="$( { xcodebuild -version; ccache --version; } | shasum -a 256 | cut -d ' ' -f 1)"
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
          {
            echo "USE_CCACHE=1"
            echo "CCACHE_DIR=$RUNNER_TEMP/verity-mobile-ccache"
            echo "CCACHE_CONFIGPATH=$GITHUB_WORKSPACE/apps/mobile/build/ccache.conf"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          } >> "$GITHUB_ENV"

      # Store compiler objects only. A fresh run id rolls the snapshot forward
      # while the restore prefix still reuses objects from the previous run.
      # renovate: datasource=github-actions depName=actions/cache
      - name: Restore native compiler cache
        if: needs.changes.outputs.compile == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/verity-mobile-ccache
          key: mobile-ci-ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler-cache.outputs.toolchain }}-${{ hashFiles('package-lock.json', 'apps/mobile/build/ccache.conf', 'scripts/patch-mobile-native-deps.mjs', 'scripts/prepare-mobile-eas-build.mjs', 'apps/mobile/app.config.ts') }}-${{ github.run_id }}
          restore-keys: |
            mobile-ci-ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler-cache.outputs.toolchain }}-${{ hashFiles('package-lock.json', 'apps/mobile/build/ccache.conf', 'scripts/patch-mobile-native-deps.mjs', 'scripts/prepare-mobile-eas-build.mjs', 'apps/mobile/app.config.ts') }}-

      - name: Reset native compiler cache statistics
        if: needs.changes.outputs.compile == 'true'
        run: ccache --zero-stats

      - name: Install CocoaPods
        if: needs.changes.outputs.compile == 'true'
        working-directory: apps/mobile/ios
        run: pod install

      - name: Compile the iOS simulator app
        if: needs.changes.outputs.compile == 'true'
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          scheme=Verity
          xcodebuild -workspace "$workspace" -list -json \
            | ruby -rjson -e 'schemes=JSON.parse(STDIN.read).dig("workspace", "schemes") || []; abort "missing #{ARGV[0]} scheme" unless schemes.include?(ARGV[0])' "$scheme"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Report native compiler cache statistics
        if: needs.changes.outputs.compile == 'true'
        run: ccache --show-stats --verbose >> "$GITHUB_STEP_SUMMARY"

      - name: Verify iOS enrollment Keychain persistence
        if: needs.changes.outputs.compile == 'true' || needs.changes.outputs.enrollment == 'true'
        # A cold macOS-26 simulator can take several minutes to launch the first app.
        timeout-minutes: 20
        run: bash scripts/enrollment-proof/run-ios.sh

      # Runs after prebuild: the harness reads the App Transport Security
      # dictionary out of the generated Info.plist, which is what decides
      # whether iOS keeps a pinned private-CA connection at all.
      - name: Verify pinned TLS against a self-signed server
        if: needs.changes.outputs.compile == 'true' || needs.changes.outputs.tls == 'true'
        run: scripts/ios-pinned-tls-smoke.sh

      - name: Verify pinned TLS through an opaque relay
        if: needs.changes.outputs.compile == 'true' || needs.changes.outputs.tls == 'true'
        env:
          VERITY_SMOKE_OPAQUE_RELAY: '1'
        run: scripts/ios-pinned-tls-smoke.sh

      - name: Verify native Remote Control tunnel prototype
        if: needs.changes.outputs.compile == 'true' || needs.changes.outputs.tunnel == 'true'
        timeout-minutes: 10
        run: |
          node --test scripts/remote-control-tunnel/mock.test.mjs
          node --test scripts/remote-control-staging/probe.test.mjs
          bash scripts/remote-control-tunnel/run-apple.sh macos
          bash scripts/remote-control-tunnel/run-apple.sh ios

      - name: Probe Staging Remote Control through the native tunnels
        if: github.event_name == 'workflow_dispatch' && inputs.installation_handle != ''
        timeout-minutes: 8
        env:
          VERITY_REMOTE_UPLINK_ORIGIN: ${{ inputs.uplink_origin }}
          VERITY_REMOTE_INSTALLATION_HANDLE: ${{ inputs.installation_handle }}
          VERITY_REMOTE_CORE_URL: ${{ inputs.core_url }}
          VERITY_REMOTE_CORE_PIN: ${{ inputs.core_pin }}
        run: |
          bash scripts/remote-control-staging/run.sh
          VERITY_REMOTE_PROBE_MODE=app bash scripts/remote-control-staging/run.sh
          # Longer than the 15 s ping interval and the old 15 s request timeout
          # that ended idle app attachments.
          VERITY_REMOTE_PROBE_MODE=app VERITY_REMOTE_PROBE_IDLE_SECONDS=40 \
            bash scripts/remote-control-staging/run.sh
