name: verity-mobile-ota-promote

# The staging publisher changes only the candidate manifest in its promotion PR.
# A merge therefore acts as the explicit approval to move the existing, tested
# EAS branch to the channel embedded in TestFlight binaries.
on:
  push:
    branches: [main]
    paths: [apps/mobile/ota-promotion.json]
  workflow_dispatch:
    inputs:
      recovery-candidate:
        description: Expected approved manifest hash for automatic recovery
        type: string
        default: ''
      recovery-pipeline:
        description: Expected promotion pipeline hash for automatic recovery
        type: string
        default: ''

permissions: read-all

concurrency:
  group: release-mobile
  queue: max
  cancel-in-progress: false

jobs:
  promote:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      # A delivery strands later candidates; dispatching staging restages them.
      actions: write
      contents: write
      pull-requests: read
      checks: read
    steps:
      # renovate: datasource=github-actions depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # renovate: datasource=github-actions depName=actions/setup-node
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'

      - name: Verify recovery checkout
        id: recovery
        env:
          RECOVERY_CANDIDATE: ${{ inputs.recovery-candidate || '' }}
          RECOVERY_PIPELINE: ${{ inputs.recovery-pipeline || '' }}
        run: node scripts/promotion-recovery.mjs ota

      # EAS resolves the Expo app config before editing a channel. Install the
      # locked workspace so config plugins such as expo-router are available.
      - if: steps.recovery.outputs.ready == 'true'
        run: npm ci

      - name: Promote exact verified OTA candidate
        id: deliver
        if: steps.recovery.outputs.ready == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/mobile-ota-release.ts promote

      # Step names persist on GitHub even if a publisher failed after preflight.
      - name: recovery-v1:${{ steps.recovery.outputs.candidate }}:${{ steps.recovery.outputs.pipeline }}:${{ steps.recovery.outputs.ready != 'true' && 'skipped' || steps.deliver.outputs.deferred == 'true' && 'deferred' || job.status == 'cancelled' && 'cancelled' || steps.deliver.outcome == 'success' && 'success' || 'failure' }}
        if: always() && steps.recovery.outcome == 'success'
        run: echo 'Promotion recovery receipt recorded.'
