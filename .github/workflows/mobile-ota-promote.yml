name: verity-mobile-ota-promote

# The staging publisher changes only the candidate manifest in its promotion PR.
# A merge therefore acts as the explicit approval to move the existing, tested
# EAS branch to the channel embedded in TestFlight binaries.
on:
  push:
    branches: [main]
    paths: [apps/mobile/ota-promotion.json]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: release-mobile
  queue: max
  cancel-in-progress: false

jobs:
  promote:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
      checks: read
    steps:
      # renovate: datasource=github-actions depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # renovate: datasource=github-actions depName=actions/setup-node
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'

      # EAS resolves the Expo app config before editing a channel. Install the
      # locked workspace so config plugins such as expo-router are available.
      - run: npm ci

      - name: Promote exact verified OTA candidate
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/mobile-ota-release.ts promote
