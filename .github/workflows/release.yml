name: verity-release

# Called once per train while the dispatcher holds its complete lifecycle lock.
# Keep this filename: installed Servers trust its Fulcio signing identity.
on:
  workflow_call:
    inputs:
      train:
        required: true
        type: string
      mobile-tag:
        description: Existing draft mobile-vX.Y.0 release to recover
        required: false
        type: string
      backend-version:
        description: Existing draft maintenance release version (X.Y.Z)
        required: false
        type: string
      backend-ref:
        description: Maintenance source branch or tag
        required: false
        type: string
      backend-republish:
        description: Republish an existing backend release and stable channel
        required: false
        default: false
        type: boolean
      backend-artifact-only:
        description: Publish a reviewed maintenance bridge without promoting channels
        required: false
        default: false
        type: boolean
      backend-schema-forward-max:
        description: Reviewed migration key promised readable by a maintenance bridge
        required: false
        type: string
      backend-accept-no-rollback:
        description: Republish despite a failed N-1 rollback (irreversible emergency override)
        required: false
        default: false
        type: boolean
      backend-replan:
        description: Plan the next backend release PR after a completed publication
        required: false
        default: false
        type: boolean
      website-version:
        description: Existing website release version to recover (X.Y.Z)
        required: false
        type: string
      website-ref:
        description: Commit, branch, or tag backing the existing website release
        required: false
        type: string

permissions:
  contents: read

jobs:
  release-please:
    concurrency:
      group: release-metadata
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Release Please creates releases and PRs; this job also dispatches the
    # checks that GITHUB_TOKEN-created PRs do not trigger automatically.
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      backend-release-created: ${{ steps.maintenance.outputs.release_created || steps.release-backend.outputs['release_created'] }}
      backend-version: ${{ steps.maintenance.outputs.version || format('{0}.{1}.{2}', steps.release-backend.outputs['major'], steps.release-backend.outputs['minor'], steps.release-backend.outputs['patch']) }}
      backend-sha: ${{ steps.maintenance.outputs.sha || steps.release-backend.outputs['sha'] }}
      mobile-release-created: ${{ steps.release-mobile.outputs['apps/mobile--release_created'] }}
      mobile-version: ${{ steps.release-mobile.outputs['apps/mobile--major'] }}.${{ steps.release-mobile.outputs['apps/mobile--minor'] }}.${{ steps.release-mobile.outputs['apps/mobile--patch'] }}
      mobile-sha: ${{ steps.release-mobile.outputs['apps/mobile--sha'] }}
      mobile-tag: ${{ steps.release-mobile.outputs['apps/mobile--tag_name'] }}
      mobile-already-published: ${{ steps.mobile-recovery.outputs.published }}
      # The website is its own release train (`website-vX.Y.Z`), so it has no
      # maintenance arm to fall back to: `steps.maintenance` recovers a backend
      # version and says nothing about this package.
      website-release-created: ${{ steps.website-recovery.outputs.release_created || steps.release-website.outputs['docs/website--release_created'] }}
      website-version: ${{ steps.website-recovery.outputs.version || format('{0}.{1}.{2}', steps.release-website.outputs['docs/website--major'], steps.release-website.outputs['docs/website--minor'], steps.release-website.outputs['docs/website--patch']) }}
      website-sha: ${{ steps.website-recovery.outputs.sha || steps.release-website.outputs['docs/website--sha'] }}
    steps:
      - name: Validate artifact-only maintenance request
        env:
          ARTIFACT_ONLY: ${{ inputs.backend-artifact-only }}
          EVENT_NAME: ${{ github.event_name }}
          TRAIN: ${{ inputs.train }}
          VERSION: ${{ inputs.backend-version }}
          SOURCE_REF: ${{ inputs.backend-ref }}
          SCHEMA_FORWARD_MAX: ${{ inputs.backend-schema-forward-max }}
          REPUBLISH: ${{ inputs.backend-republish }}
          ACCEPT_NO_ROLLBACK: ${{ inputs.backend-accept-no-rollback }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ARTIFACT_ONLY" == true ]]; then
            if [[ "$EVENT_NAME" != workflow_dispatch || "$TRAIN" != backend ||
                  ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || -z "$SOURCE_REF" ||
                  ! "$SCHEMA_FORWARD_MAX" =~ ^[0-9]{4}_[a-z0-9_]+$ ||
                  "$REPUBLISH" == true || "$ACCEPT_NO_ROLLBACK" == true ]]; then
              echo '::error::Artifact-only publication requires a manual backend maintenance draft, version/ref, and reviewed schema-forward-max; republish and no-rollback overrides are forbidden.' >&2
              exit 1
            fi
          fi

      - name: Validate backend re-plan request
        env:
          REPLAN: ${{ inputs.backend-replan }}
          EVENT_NAME: ${{ github.event_name }}
          MOBILE_TAG: ${{ inputs.mobile-tag }}
          VERSION: ${{ inputs.backend-version }}
          SOURCE_REF: ${{ inputs.backend-ref }}
          SCHEMA_FORWARD_MAX: ${{ inputs.backend-schema-forward-max }}
          REPUBLISH: ${{ inputs.backend-republish }}
          ARTIFACT_ONLY: ${{ inputs.backend-artifact-only }}
          ACCEPT_NO_ROLLBACK: ${{ inputs.backend-accept-no-rollback }}
          WEBSITE_VERSION: ${{ inputs.website-version }}
          WEBSITE_REF: ${{ inputs.website-ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REPLAN" == true ]]; then
            # A re-plan carries no recovery input: planning may never publish,
            # and a request that mixes both hides which mode actually ran.
            if [[ "$EVENT_NAME" != workflow_dispatch ||
                  -n "${MOBILE_TAG}${VERSION}${SOURCE_REF}${SCHEMA_FORWARD_MAX}${WEBSITE_VERSION}${WEBSITE_REF}" ||
                  "$REPUBLISH" == true || "$ARTIFACT_ONLY" == true || "$ACCEPT_NO_ROLLBACK" == true ]]; then
              echo '::error::A backend re-plan is a manual planning run and must carry no recovery input.' >&2
              exit 1
            fi
          fi

      - name: Repair workspace ownership
        working-directory: /
        run: |
          set -euo pipefail
          if [[ -d "${GITHUB_WORKSPACE:-}" ]]; then
            owner="$(id -u):$(id -g)"
            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              sudo -n chown -R "$owner" "$GITHUB_WORKSPACE" || true
            elif command -v docker >/dev/null 2>&1; then
              # No sudo on the runner: a prior container job left root-owned files the
              # non-root runner can't chown (so actions/checkout's clean fails with
              # EACCES). Chown them back as root in a throwaway container — the runner
              # is in the docker group.
              docker run --rm -v "$GITHUB_WORKSPACE":/ws \
                python:3.14-slim@sha256:44dd04494ee8f3b538294360e7c4b3acb87c8268e4d0a4828a6500b1eff50061 \
                chown -R "$owner" /ws || true
            else
              chown -R "$owner" "$GITHUB_WORKSPACE" 2>/dev/null || true
            fi
          fi

      - name: Enforce release-safe merge policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          merge_policy="$(gh api "repos/${GITHUB_REPOSITORY}" \
            --jq '[.allow_merge_commit, .allow_squash_merge, .allow_rebase_merge] | @tsv')"
          # The reviewed Conventional Commit title and all changed product paths
          # must reach main together. Rebase merges substitute intermediate
          # commit subjects for the reviewed release classification.
          if [[ "$merge_policy" != $'false\ttrue\tfalse' ]]; then
            echo "::error::Under Settings > General > Pull Requests, enable squash merging only. Merge commits can be parsed twice, while rebase merges bypass the reviewed pull request title."
            exit 1
          fi

      # The selector diffs immutable event SHAs locally. A complete checkout
      # avoids the Compare API's 300-file ceiling and keeps large pushes from
      # hiding a manifest or a file that does not belong to the selected train.
      # renovate: datasource=github-actions depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push' || inputs.backend-replan
        with:
          fetch-depth: 0

      # Native compatibility uses Expo's installed dependency graph.
      # renovate: datasource=github-actions depName=actions/setup-node
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: github.event_name == 'push' && inputs.train == 'mobile'
        with:
          node-version: '24.21.0'
      - name: Install native classification dependencies
        if: github.event_name == 'push' && inputs.train == 'mobile'
        run: npm ci

      - name: Select release trains for this push
        id: release-trains
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          TRAIN: ${{ inputs.train }}
        shell: bash
        run: |
          set -euo pipefail
          diff="$(git diff --no-renames --name-status "$BEFORE" "$HEAD_SHA")" || {
            echo "::error::Could not resolve the immutable push diff ${BEFORE}...${HEAD_SHA}." >&2
            exit 1
          }
          if [[ -z "$diff" ]]; then
            # A valid push shape (squash merge whose content already landed),
            # not a resolution failure — that case exited above. Fall through
            # to the always-on trains so delayed-release catch-up still runs.
            echo "::notice::Empty push diff ${BEFORE}...${HEAD_SHA}: duplicate content; selecting the default trains."
          fi

          backend=false
          mobile=false
          website=false
          while IFS=$'\t' read -r status file; do
            case "$file" in
              .release-please-manifest.backend.json)
                # Moving the package key without changing its version is a
                # source migration, not a release PR ready for publication.
                previous_manifest="$(git show "$BEFORE:$file")"
                current_manifest="$(git show "$HEAD_SHA:$file")"
                if jq -en --argjson before "$previous_manifest" --argjson after "$current_manifest" '
                  ($before | keys) == [".release/backend"] and
                  ($after | keys) == ["."] and
                  ($before[".release/backend"] | type) == "string" and
                  $before[".release/backend"] == $after["."]
                ' >/dev/null; then
                  [[ "$status" == M ]] || exit 1
                  continue
                fi
                backend=true
                ;;
              .release-please-manifest.mobile.json) mobile=true ;;
              .release-please-manifest.website.json) website=true ;;
              *) continue ;;
            esac
            [[ "$status" == M ]] || {
              echo "::error::Release manifest $file had Git status $status rather than M." >&2
              exit 1
            }
          done <<<"$diff"

          if [[ "$backend" == false && "$mobile" == false && "$website" == false ]]; then
            # Ordinary source pushes update the always-on trains. Mobile is
            # different: JS-only changes ship through the OTA train and must not
            # make a native release look necessary. Compare cumulatively from
            # the latest native release so an OTA-safe merge cannot hide an
            # earlier native change that has not reached TestFlight yet.
            backend=true
            website=true
            if [[ "$TRAIN" == mobile ]]; then
              native_tag="$(git tag --merged "$HEAD_SHA" --list 'mobile-v[0-9]*.[0-9]*.0' --sort=-version:refname | head -n 1)"
              if [[ -z "$native_tag" ]]; then
                echo '::error::No native release boundary; explicit bootstrap is required.' >&2
                exit 1
              fi
              if ! native_changes="$(node scripts/mobile-native-compatibility.mjs "$native_tag" "$HEAD_SHA")"; then
                echo "::error::Could not classify native compatibility with $native_tag." >&2
                exit 1
              fi
              if [[ -n "$native_changes" ]]; then
                mobile=true
                echo "$native_changes"
              fi
            fi
          else
            # A release-please merge may publish only the train whose manifest is
            # in this event's immutable diff. Do not let a delayed run observe a
            # later merge through the moving main branch and publish that train.
            while IFS=$'\t' read -r _ file; do
              owned=false
              if [[ "$backend" == true ]]; then
                case "$file" in
                  .release-please-manifest.backend.json|CHANGELOG.md|version.txt) owned=true ;;
                esac
              fi
              if [[ "$mobile" == true ]]; then
                case "$file" in
                  .release-please-manifest.mobile.json|apps/mobile/CHANGELOG.md|apps/mobile/app.config.ts|apps/mobile/version.txt) owned=true ;;
                esac
              fi
              if [[ "$website" == true ]]; then
                case "$file" in
                  .release-please-manifest.website.json|docs/website/CHANGELOG.md|docs/website/version.txt) owned=true ;;
                esac
              fi
              [[ "$owned" == true ]] || {
                echo "::error::$file does not belong to the release train selected by this push." >&2
                exit 1
              }
            done <<<"$diff"
          fi

          {
            echo "backend=$backend"
            echo "mobile=$mobile"
            echo "website=$website"
          } >> "$GITHUB_OUTPUT"

      - name: Reconcile release lifecycle
        id: lifecycle
        if: >-
          (github.event_name == 'push' && steps.release-trains.outputs[inputs.train] == 'true') ||
          (inputs.backend-replan && inputs.train == 'backend')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/release-lifecycle.mjs '${{ inputs.train }}' '${{ github.sha }}'

      # GitHub's Releases API creates a missing tag as part of the release. If
      # a delayed run targets a release commit behind HEAD and workflow files
      # changed in between, that implicit ref creation requires workflows:write
      # — a permission GITHUB_TOKEN cannot receive. Create only that recovery
      # tag as an ordinary Git ref first; Release Please then attaches the
      # release to the existing, verified tag. On-time release runs retain the
      # normal draft-without-a-tag lifecycle.
      - name: Require tags for delayed release commits
        if: github.event_name == 'push' && steps.lifecycle.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          BACKEND_SELECTED: ${{ inputs.train == 'backend' && steps.release-trains.outputs.backend == 'true' && steps.lifecycle.outputs.mode != 'skip' }}
          MOBILE_SELECTED: ${{ inputs.train == 'mobile' && steps.release-trains.outputs.mobile == 'true' && steps.lifecycle.outputs.mode != 'skip' }}
          WEBSITE_SELECTED: ${{ inputs.train == 'website' && steps.release-trains.outputs.website == 'true' && steps.lifecycle.outputs.mode != 'skip' }}
        shell: bash
        run: |
          set -euo pipefail
          pretag_delayed_release() {
            local selected="$1" component="$2" manifest="$3" path="$4" prefix="$5"
            [[ "$selected" == true ]] || return 0

            local prs count pr author release_sha version tag
            prs="$(gh pr list --state merged --base main \
              --head "release-please--branches--main--components--${component}" \
              --label 'autorelease: pending' --limit 2 \
              --json number,author,mergeCommit)"
            count="$(jq 'length' <<<"$prs")"
            [[ "$count" != 0 ]] || return 0
            if [[ "$count" != 1 ]]; then
              echo "::error::Found $count pending $component release PRs; refusing to guess a tag target." >&2
              exit 1
            fi

            pr="$(jq -r '.[0].number' <<<"$prs")"
            author="$(jq -r '.[0].author.login' <<<"$prs")"
            release_sha="$(jq -r '.[0].mergeCommit.oid' <<<"$prs")"
            if [[ "$author" != 'app/github-actions' && "$author" != 'github-actions' ]] ||
              [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Pending $component release PR #$pr has an unexpected author or merge commit." >&2
              exit 1
            fi
            git merge-base --is-ancestor "$release_sha" "$HEAD_SHA" || {
              echo "::error::Pending $component release PR #$pr is not an ancestor of this push." >&2
              exit 1
            }

            # HEAD needs no workaround. A delayed target needs one only when
            # its workflow tree differs, which is the scope GitHub protects.
            [[ "$release_sha" != "$HEAD_SHA" ]] || return 0
            git diff --quiet "$release_sha" "$HEAD_SHA" -- .github/workflows && return 0

            version="$(jq -er --arg path "$path" '.[$path] | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' "$manifest")"
            tag="${prefix}${version}"
            if git show-ref --verify --quiet "refs/tags/${tag}"; then
              tagged_sha="$(git rev-parse "${tag}^{commit}")"
              if [[ "$tagged_sha" != "$release_sha" ]]; then
                echo "::error::$tag points to $tagged_sha, not pending release commit $release_sha." >&2
                exit 1
              fi
              return 0
            fi

            echo "::error::Delayed $component release PR #$pr needs $tag at $release_sha, but the workflow token cannot create a tag whose tree contains older workflow files." >&2
            echo "Create and push the validated tag from an authorized checkout, then re-run this workflow:" >&2
            echo "  git tag $tag $release_sha" >&2
            echo "  git push origin refs/tags/$tag" >&2
            exit 1
          }

          pretag_delayed_release "$BACKEND_SELECTED" server \
            .release-please-manifest.backend.json '.' v
          pretag_delayed_release "$MOBILE_SELECTED" mobile \
            .release-please-manifest.mobile.json 'apps/mobile' mobile-v
          pretag_delayed_release "$WEBSITE_SELECTED" website \
            .release-please-manifest.website.json 'docs/website' website-v

      - name: Open backend release PR or create release
        id: release-backend
        # A re-plan reaches Release Please only in planning mode, so a manual
        # run can never create a release the push lifecycle did not authorize.
        if: >-
          inputs.train == 'backend' &&
          ((github.event_name == 'push' && steps.release-trains.outputs.backend == 'true' && steps.lifecycle.outputs.mode != 'skip') ||
          (inputs.backend-replan && steps.lifecycle.outputs.mode == 'plan'))
        # renovate: datasource=github-actions depName=googleapis/release-please-action
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.backend.json
          manifest-file: .release-please-manifest.backend.json
          skip-github-release: ${{ steps.lifecycle.outputs.mode != 'release' }}
          skip-github-pull-request: ${{ steps.lifecycle.outputs.mode != 'plan' }}

      - name: Open mobile release PR or create release
        id: release-mobile
        if: github.event_name == 'push' && inputs.train == 'mobile' && steps.release-trains.outputs.mobile == 'true' && steps.lifecycle.outputs.mode != 'skip'
        # renovate: datasource=github-actions depName=googleapis/release-please-action
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.mobile.json
          manifest-file: .release-please-manifest.mobile.json
          skip-github-release: ${{ steps.lifecycle.outputs.mode != 'release' }}
          skip-github-pull-request: ${{ steps.lifecycle.outputs.mode != 'plan' }}

      - name: Open website release PR or create release
        id: release-website
        if: github.event_name == 'push' && inputs.train == 'website' && steps.release-trains.outputs.website == 'true' && steps.lifecycle.outputs.mode != 'skip'
        # renovate: datasource=github-actions depName=googleapis/release-please-action
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.website.json
          manifest-file: .release-please-manifest.website.json
          skip-github-release: ${{ steps.lifecycle.outputs.mode != 'release' }}
          skip-github-pull-request: ${{ steps.lifecycle.outputs.mode != 'plan' }}

      - name: Detect completed native recovery
        id: mobile-recovery
        if: github.event_name == 'workflow_dispatch' && inputs.train == 'mobile' && inputs['mobile-tag'] != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs['mobile-tag'] }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^mobile-v[0-9]+\.[0-9]+\.0$ ]]
          if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" == false ]]; then
            echo 'Native release is already published; recovery has nothing to change.'
            echo 'published=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate maintenance backend release
        id: maintenance
        if: github.event_name == 'workflow_dispatch' && inputs.train == 'backend' && inputs['backend-version'] != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job deliberately has no checkout. Tell gh which repository to
          # query instead of making it discover one from a nonexistent .git.
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.backend-version }}
          SOURCE_REF: ${{ inputs.backend-ref }}
          REPUBLISH: ${{ inputs.backend-republish }}
          SCHEMA_FORWARD_MAX: ${{ inputs.backend-schema-forward-max }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Maintenance backend version must match X.Y.Z, got '$VERSION'." >&2
            exit 1
          fi
          if [[ -z "$SOURCE_REF" ]]; then
            echo '::error::backend-ref is required with backend-version.' >&2
            exit 1
          fi
          if [[ -n "$SCHEMA_FORWARD_MAX" && ! "$SCHEMA_FORWARD_MAX" =~ ^[0-9]{4}_[a-z0-9_]+$ ]]; then
            echo "::error::backend-schema-forward-max must be a migration key." >&2
            exit 1
          fi
          tag="v${VERSION}"
          release_json="$(gh release view "$tag" --json isDraft,targetCommitish)"
          is_draft="$(jq -r '.isDraft' <<<"$release_json")"
          target="$(jq -r '.targetCommitish' <<<"$release_json")"
          if [[ "$REPUBLISH" == 'true' ]]; then
            if [[ "$is_draft" == 'true' ]]; then
              echo "::error::$tag is still a draft; republish is only for an existing release." >&2
              exit 1
            fi
          elif [[ "$is_draft" != 'true' ]]; then
            echo "::error::$tag must exist as a draft release before maintenance publishing." >&2
            exit 1
          fi
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SOURCE_REF}" --jq '.sha')"
          if [[ "$is_draft" == 'true' ]]; then
            # GitHub creates refs/tags/<tag> only when publishing the release, so
            # accept only a pinned commit target that cannot move before then.
            if [[ ! "$target" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::$tag draft target must be a full commit SHA, got '$target'." >&2
              exit 1
            fi
            release_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${target}" --jq '.sha')"
            if [[ "$target" != "$release_sha" ]]; then
              echo "::error::$tag draft target does not resolve to its recorded commit." >&2
              exit 1
            fi
          else
            tag_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.type')"
            release_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')"
            if [[ "$tag_type" == 'tag' ]]; then
              release_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${release_sha}" --jq '.object.sha')"
            elif [[ "$tag_type" != 'commit' ]]; then
              echo "::error::$tag resolves to unsupported object type $tag_type." >&2
              exit 1
            fi
          fi
          if [[ "$sha" != "$release_sha" ]]; then
            echo "::error::$tag resolves to $release_sha but backend-ref resolves to $sha." >&2
            exit 1
          fi
          {
            echo 'release_created=true'
            echo "version=$VERSION"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      # Recovery is deliberately narrower than normal release creation. The
      # GitHub Actions integration may be refused by the Releases API even with
      # `contents: write`; a human can publish the missing GitHub release, then
      # this path verifies its immutable tag/source binding before rebuilding
      # and promoting the website image through the ordinary publish job.
      - name: Validate existing website release for recovery
        id: website-recovery
        if: github.event_name == 'workflow_dispatch' && inputs.train == 'website' && inputs['website-version'] != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.website-version }}
          SOURCE_REF: ${{ inputs.website-ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Website version must match X.Y.Z, got '$VERSION'." >&2
            exit 1
          fi
          if [[ -z "$SOURCE_REF" ]]; then
            echo '::error::website-ref is required with website-version.' >&2
            exit 1
          fi
          tag="website-v${VERSION}"
          release="$(gh release view "$tag" --json isDraft,targetCommitish)"
          source_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SOURCE_REF}" --jq '.sha')"
          if [[ "$(jq -r .isDraft <<< "$release")" == true ]]; then
            release_sha="$(jq -r .targetCommitish <<< "$release")"
            [[ "$release_sha" =~ ^[a-f0-9]{40}$ ]] || {
              echo '::error::Website draft must record an immutable source SHA.' >&2
              exit 1
            }
          else
            release_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq '.sha')"
          fi
          if [[ "$source_sha" != "$release_sha" ]]; then
            echo "::error::$tag resolves to $release_sha but website-ref resolves to $source_sha." >&2
            exit 1
          fi
          {
            echo 'release_created=true'
            echo "version=$VERSION"
            echo "sha=$source_sha"
          } >> "$GITHUB_OUTPUT"

      # Pull requests created with GITHUB_TOKEN intentionally do not emit another
      # pull_request workflow event. Dispatch CI explicitly for every release PR
      # branch instead of introducing a long-lived PAT. Each isolated train can
      # create a PR in the same run, so collect all three `prs` outputs.
      # renovate: datasource=github-actions depName=actions/setup-node
      - if: >-
          steps.release-backend.outputs.prs_created == 'true' ||
          steps.release-mobile.outputs.prs_created == 'true' ||
          steps.release-website.outputs.prs_created == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'

      - name: Run checks for release PRs
        if: >-
          steps.release-backend.outputs.prs_created == 'true' ||
          steps.release-mobile.outputs.prs_created == 'true' ||
          steps.release-website.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BACKEND_PRS_JSON: ${{ steps.release-backend.outputs.prs }}
          MOBILE_PRS_JSON: ${{ steps.release-mobile.outputs.prs }}
          WEBSITE_PRS_JSON: ${{ steps.release-website.outputs.prs }}
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const prs = [["backend", "BACKEND_PRS_JSON"], ["mobile", "MOBILE_PRS_JSON"], ["website", "WEBSITE_PRS_JSON"]]
              .flatMap(([train, name]) => {
                const value = JSON.parse(process.env[name] || "[]");
                return (Array.isArray(value) ? value : [value]).map((pr) => ({ train, pr }));
              });
            for (const { train, pr } of prs) {
              const branch = pr.headBranchName || pr.headRefName || pr.branchName;
              if (!branch) throw new Error("release-please PR has no head branch");
              process.stdout.write(`${train}\t${branch}\n`);
            }
          ' | while IFS=$'\t' read -r train branch; do
            pr_number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
            if [[ -z "$pr_number" ]]; then
              echo "::error::Could not resolve the release PR for $branch." >&2
              exit 1
            fi
            echo "Dispatching $train CI for $branch"
            gh workflow run ci.yml --ref "$branch" -f release-train="$train" -f release-pr="$pr_number"
            echo "Dispatching Gitleaks for $branch"
            gh workflow run gitleaks-dispatch.yml --ref "$branch"
            # Release Please normally changes only these three mobile metadata
            # files. Native source changes were compiled on their originating
            # PRs, and the final signed device archive is built from the merged
            # release SHA below. Keep a defensive fallback in case future
            # release configuration starts editing another mobile file.
            changed_files="$(gh pr diff "$pr_number" --name-only)"
            unexpected_mobile_files="$(grep '^apps/mobile/' <<< "$changed_files" \
              | grep -Ev '^apps/mobile/(CHANGELOG\.md|app\.config\.ts|version\.txt)$' || true)"
            if [[ -n "$unexpected_mobile_files" ]]; then
              echo "Release PR changes native-relevant mobile files; dispatching iOS compile:"
              echo "$unexpected_mobile_files"
              gh workflow run mobile-native-verify.yml --ref "$branch" -f ref="$branch"
            fi
          done

      # Preserve the removed handoff's validation before any backend job can start.
      - name: Validate backend publication identity
        id: validate-backend
        if: steps.maintenance.outputs.release_created == 'true' || steps.release-backend.outputs['release_created'] == 'true'
        env:
          VERSION: ${{ steps.maintenance.outputs.version || format('{0}.{1}.{2}', steps.release-backend.outputs['major'], steps.release-backend.outputs['minor'], steps.release-backend.outputs['patch']) }}
          SHA: ${{ steps.maintenance.outputs.sha || steps.release-backend.outputs['sha'] }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]

  publish-mobile-native:
    # Not gated on the cutover: the native app is its own release train and
    # carries no Server image, so a failing Server cutover has nothing to say
    # about it.
    needs: release-please
    if: >-
      always() && inputs.train == 'mobile' &&
      needs.release-please.result == 'success' &&
      needs.release-please.outputs.mobile-already-published != 'true' &&
      (needs.release-please.outputs.mobile-release-created == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs['mobile-tag'] != '' && github.ref == 'refs/heads/main'))
    # Public-repository GitHub-hosted runners are free. Keep the expensive macOS
    # allocation scoped to the native release job only.
    runs-on: macos-26
    timeout-minutes: 120
    env:
      MOBILE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs['mobile-tag'] || needs.release-please.outputs.mobile-tag }}
    permissions:
      contents: write
      issues: write
      pull-requests: read
    steps:
      - name: Resolve immutable native release source
        id: native-source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MOBILE_TAG" =~ ^mobile-v[0-9]+\.[0-9]+\.0$ ]]
          release="$(gh release view "$MOBILE_TAG" --json isDraft,targetCommitish)"
          [[ "$(jq -r .isDraft <<< "$release")" == true ]]
          sha="$(jq -r .targetCommitish <<< "$release")"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || {
            echo '::error::Native draft must record an immutable source SHA.' >&2
            exit 1
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # renovate: datasource=github-actions depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.native-source.outputs.sha }}
          fetch-depth: 0

      - name: Validate native release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$MOBILE_TAG" =~ ^mobile-v[0-9]+\.[0-9]+\.0$ ]]; then
            echo "::error::Native release tag must match mobile-vX.Y.0, got '$MOBILE_TAG'." >&2
            exit 1
          fi
          is_draft="$(gh release view "$MOBILE_TAG" --json isDraft --jq '.isDraft')"
          if [[ "$is_draft" != "true" ]]; then
            echo "::error::$MOBILE_TAG must still be a draft release before TestFlight publishing." >&2
            exit 1
          fi
          configured_version="$(tr -d '[:space:]' < apps/mobile/version.txt)"
          if [[ "mobile-v${configured_version}" != "$MOBILE_TAG" ]]; then
            echo "::error::Checked-out mobile version $configured_version does not match $MOBILE_TAG." >&2
            exit 1
          fi

      - name: Verify native tag still names the candidate
        shell: bash
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/${MOBILE_TAG}"; then
            [[ "$(git rev-parse "${MOBILE_TAG}^{commit}")" == "$(git rev-parse HEAD)" ]] || {
              echo '::error::Native tag differs from its recorded release source.' >&2
              exit 1
            }
          fi

      # The release job must not depend on the ambient Node.js installation.
      # renovate: datasource=github-actions depName=actions/setup-node
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'

      - name: Require App Store Connect credentials
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ASC_ISSUER_ID ASC_KEY_ID ASC_KEY_P8 ASC_APP_ID APPLE_TEAM_ID EXPO_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required for the native TestFlight release." >&2
              exit 1
            fi
          done

      - name: Require Google Drive OAuth client
        env:
          GOOGLE_AUTH_ID: ${{ vars.GOOGLE_AUTH_ID || '340053543157-ohufghcdnc5do2lkjg7cgnkk67oac0e7.apps.googleusercontent.com' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GOOGLE_AUTH_ID:-}" =~ ^[0-9]+-[a-z0-9-]+\.apps\.googleusercontent\.com$ ]]; then
            echo "::error::GOOGLE_AUTH_ID must contain a Google iOS OAuth client ID." >&2
            exit 1
          fi

      - name: Install mobile dependencies
        run: npm ci

      - name: Prepare mobile sources
        run: |
          npm run -w @verity/mobile-app patch:native
          npm run -w @verity/mobile build

      - name: Configure native compiler cache pilot
        id: compiler-cache
        shell: bash
        run: |
          set -euo pipefail
          command -v ccache >/dev/null || brew install ccache
          toolchain="$( { xcodebuild -version; ccache --version; } | shasum -a 256 | cut -d ' ' -f 1)"
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
          {
            echo "USE_CCACHE=1"
            echo "CCACHE_DIR=$RUNNER_TEMP/verity-mobile-ccache"
            echo "CCACHE_CONFIGPATH=$GITHUB_WORKSPACE/apps/mobile/build/ccache.conf"
            echo "EAS_LOCAL_BUILD_WORKINGDIR=$RUNNER_TEMP/verity-eas-build"
            echo "CCACHE_BASEDIR=$RUNNER_TEMP/verity-eas-build"
          } >> "$GITHUB_ENV"

      # Reuse only compiler objects, never credentials, IPAs, or EAS work directories.
      # No broad restore prefix: compiler, dependencies and patch policy must agree.
      # renovate: datasource=github-actions depName=actions/cache
      - name: Restore native compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/verity-mobile-ccache
          key: mobile-ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler-cache.outputs.toolchain }}-${{ hashFiles('package-lock.json', 'apps/mobile/build/ccache.conf', 'scripts/patch-mobile-native-deps.mjs', 'scripts/prepare-mobile-eas-build.mjs', 'apps/mobile/app.config.ts') }}

      - name: Reset native compiler cache statistics
        run: ccache --zero-stats

      - name: Build and upload native TestFlight release
        working-directory: apps/mobile
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_AUTH_ID: ${{ vars.GOOGLE_AUTH_ID || '340053543157-ohufghcdnc5do2lkjg7cgnkk67oac0e7.apps.googleusercontent.com' }}
        shell: bash
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/app-store-connect"
          key_path="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          ipa="$RUNNER_TEMP/Verity.ipa"
          mkdir -p "$key_dir"
          printf '%s' "$ASC_KEY_P8" > "$key_path"
          chmod 600 "$key_path"

          mint_asc_jwt() {
            ruby -ropenssl -rjson -rbase64 -e '
              b64 = ->(value) { Base64.urlsafe_encode64(value, padding: false) }
              header = b64.call({ alg: "ES256", kid: ENV.fetch("ASC_KEY_ID"), typ: "JWT" }.to_json)
              now = Time.now.to_i
              claims = b64.call({ iss: ENV.fetch("ASC_ISSUER_ID"), iat: now - 60, exp: now + 1200, aud: "appstoreconnect-v1" }.to_json)
              input = "#{header}.#{claims}"
              der = OpenSSL::PKey.read(File.read(ARGV.fetch(0))).sign(OpenSSL::Digest::SHA256.new, input)
              r, s = OpenSSL::ASN1.decode(der).value.map(&:value)
              raw = [r, s].map { |part| [part.to_s(16).rjust(64, "0")].pack("H*") }.join
              print "#{input}.#{b64.call(raw)}"
            ' "$key_path"
          }
          asc_jwt="$(mint_asc_jwt)"
          expected_bundle_id="$(npx expo config --type public --json \
            | ruby -rjson -e 'print JSON.parse(STDIN.read).dig("ios", "bundleIdentifier")')"
          app_json="$(curl --fail-with-body \
            --retry 3 --retry-all-errors --max-time 30 \
            --header "Authorization: Bearer $asc_jwt" \
            "https://api.appstoreconnect.apple.com/v1/apps/$ASC_APP_ID")"
          actual_bundle_id="$(ruby -rjson -e 'print JSON.parse(STDIN.read).dig("data", "attributes", "bundleId")' <<< "$app_json")"
          if [[ "$actual_bundle_id" != "$expected_bundle_id" ]]; then
            echo "::error::ASC_APP_ID $ASC_APP_ID belongs to '$actual_bundle_id', expected '$expected_bundle_id'." >&2
            exit 1
          fi

          builds_json="$(curl --fail-with-body --get \
            --retry 3 --retry-all-errors --max-time 30 \
            --header "Authorization: Bearer $asc_jwt" \
            --data-urlencode "filter[app]=$ASC_APP_ID" \
            --data-urlencode 'sort=-uploadedDate' \
            --data-urlencode 'limit=1' \
            https://api.appstoreconnect.apple.com/v1/builds)"
          latest_build="$(ruby -rjson -e 'data=JSON.parse(STDIN.read).fetch("data"); puts(data.empty? ? 0 : Integer(data.first.dig("attributes", "version")))' <<< "$builds_json")"
          next_build="$((latest_build + 1))"
          export VERITY_IOS_BUILD_NUMBER="$next_build"

          # The repository normally lets EAS manage its remote counter. This
          # release instead uses the next number observed in App Store Connect,
          # so make only this runner's temporary EAS config use the local value.
          ruby -rjson -e '
            path = "eas.json"
            config = JSON.parse(File.read(path))
            config.fetch("cli")["appVersionSource"] = "local"
            config.fetch("build").fetch("testflight")["autoIncrement"] = false
            File.write(path, JSON.pretty_generate(config) + "\n")
          '

          # Build on the GitHub macOS runner while EAS supplies the remote
          # distribution certificate and provisioning profile. This does not
          # consume an EAS cloud-build slot or its build minutes.
          build_started="$(date +%s)"
          npx --yes eas-cli@20.3.0 build \
            --platform ios \
            --profile testflight \
            --local \
            --non-interactive \
            --output "$ipa"

          info_plist="$RUNNER_TEMP/Verity-Info.plist"
          unzip -p "$ipa" 'Payload/*.app/Info.plist' > "$info_plist"
          next_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info_plist")"
          if [[ "$next_build" != "$VERITY_IOS_BUILD_NUMBER" ]]; then
            echo "::error::The locally built IPA has build number '$next_build', expected '$VERITY_IOS_BUILD_NUMBER'." >&2
            exit 1
          fi
          echo "Built App Store build number $next_build locally on GitHub Actions."

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$key_path" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "Native build and IPA verification: $(( $(date +%s) - build_started )) seconds" >> "$GITHUB_STEP_SUMMARY"
          upload_started="$(date +%s)"
          xcrun altool --upload-app --type ios --file "$ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

          echo "Apple upload acceptance: $(( $(date +%s) - upload_started )) seconds" >> "$GITHUB_STEP_SUMMARY"
          processing_started="$(date +%s)"

          # altool success means only that Apple accepted the upload. Keep the
          # draft GitHub release closed until App Store Connect has processed
          # this exact build and declared it valid.
          for attempt in {1..60}; do
            asc_jwt="$(mint_asc_jwt)"
            if ! uploaded_builds="$(curl --fail-with-body --get \
              --retry 3 --retry-all-errors --max-time 30 \
              --header "Authorization: Bearer $asc_jwt" \
              --data-urlencode "filter[app]=$ASC_APP_ID" \
              --data-urlencode "filter[version]=$next_build" \
              --data-urlencode 'limit=1' \
              https://api.appstoreconnect.apple.com/v1/builds)"; then
              if [[ "$attempt" == 60 ]]; then
                echo "::error::App Store Connect remained unavailable while checking build $next_build." >&2
                exit 1
              fi
              echo "App Store Connect check failed transiently; retrying ($attempt/60)."
              sleep 30
              continue
            fi
            processing_state="$(ruby -rjson -e '
              data = JSON.parse(STDIN.read).fetch("data")
              print(data.empty? ? "MISSING" : data.first.dig("attributes", "processingState"))
            ' <<< "$uploaded_builds")"
            case "$processing_state" in
              VALID)
                echo "App Store Connect processed build $next_build successfully."
                echo "Apple processing: $(( $(date +%s) - processing_started )) seconds" >> "$GITHUB_STEP_SUMMARY"
                break
                ;;
              FAILED|INVALID)
                echo "::error::App Store Connect rejected build $next_build during processing ($processing_state)." >&2
                exit 1
                ;;
              MISSING|PROCESSING)
                if [[ "$attempt" == 60 ]]; then
                  echo "::error::Timed out waiting for App Store Connect to process build $next_build." >&2
                  exit 1
                fi
                echo "Build $next_build is $processing_state; waiting for App Store Connect ($attempt/60)."
                sleep 30
                ;;
              *)
                echo "::error::Unexpected App Store Connect processing state '$processing_state'." >&2
                exit 1
                ;;
            esac
          done

      - name: Report native compiler cache statistics
        if: always() && steps.compiler-cache.outcome == 'success'
        run: |
          ccache --show-stats --verbose >> "$GITHUB_STEP_SUMMARY"

      - name: Publish verified native GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Artifact-only bridges have no release-please PR; publish their pinned
          # draft without reconciling labels or marking them as the latest release.
          # release-please normally replaces this label while creating the
          # release. Recovery publishes an already-created draft without running
          # that action. Move the label first, then roll it back if publication
          # fails so either state remains retryable: pending+draft or tagged+public.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${MOBILE_TAG#mobile-v}"
            pr_numbers="$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls?state=closed&per_page=100" --jq \
              '.[] | select(.merged_at != null and .title == "chore(main): release mobile '"$version"'") | .number')"
            pr_count="$(awk 'NF { count++ } END { print count + 0 }' <<< "$pr_numbers")"
            if [ "$pr_count" -ne 1 ]; then
              echo "::error::Expected exactly one release PR for $MOBILE_TAG, found $pr_count." >&2
              exit 1
            fi
            pr_number="$pr_numbers"
            require_release_labels() {
              expected_pending="$1"
              expected_tagged="$2"
              labels="$(gh api \
                "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/labels" --jq '.[].name')"
              pending=false
              tagged=false
              grep -Fxq 'autorelease: pending' <<< "$labels" && pending=true
              grep -Fxq 'autorelease: tagged' <<< "$labels" && tagged=true
              if [ "$pending" != "$expected_pending" ] || [ "$tagged" != "$expected_tagged" ]; then
                echo "::error::Release PR labels are pending=$pending tagged=$tagged; expected pending=$expected_pending tagged=$expected_tagged." >&2
                return 1
              fi
            }
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/labels" \
              -f 'labels[]=autorelease: tagged'
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/labels/autorelease%3A%20pending" || delete_status=$?
            require_release_labels false true

            publish_status=0
            gh release edit "$MOBILE_TAG" --draft=false --latest=false || publish_status=$?
            is_draft="$(gh release view "$MOBILE_TAG" --json isDraft --jq '.isDraft')"
            if [ "$is_draft" = "true" ]; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/labels" \
                -f 'labels[]=autorelease: pending'
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/labels/autorelease%3A%20tagged" || delete_status=$?
              require_release_labels true false
              [ "$publish_status" -ne 0 ] || publish_status=1
              exit "${publish_status:-1}"
            fi
            require_release_labels false true
          else
            gh release edit "$MOBILE_TAG" --draft=false --latest=false
          fi

  publish-website:
    # The Verity product website rides its own release train, so this job is
    # gated on `website-release-created` and not on the backend release. Two
    # things follow from that, both deliberate.
    #
    # It does not need `self-update-gate`. That gate exists because a released
    # Server resolves its sandbox image and toolkit Feature at its OWN version,
    # so publishing those before self-update is proven strands a release. No
    # Server resolves the website image; ArgoCD in the k8s repository does, by
    # an explicit pin a human or Renovate moves.
    #
    # It is also absent from RELEASE_IMAGES in scripts/audit-release-images.mjs,
    # which is not an oversight — see the note there. That audit asks whether a
    # `vX.Y.Z` BACKEND release got its images; this image is versioned on a
    # different train and would read as missing for every backend release.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: release-please
    if: needs.release-please.outputs.website-release-created == 'true'
    permissions:
      contents: write
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: heey-global/verity/verity-website
      VERSION: ${{ needs.release-please.outputs.website-version }}
      TEST_CONTAINER: verity-website-release-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Repair workspace ownership
        working-directory: /
        run: |
          set -euo pipefail
          if [[ -d "${GITHUB_WORKSPACE:-}" ]]; then
            owner="$(id -u):$(id -g)"
            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              sudo -n chown -R "$owner" "$GITHUB_WORKSPACE" || true
            elif command -v docker >/dev/null 2>&1; then
              docker run --rm -v "$GITHUB_WORKSPACE":/ws \
                python:3.14-slim@sha256:44dd04494ee8f3b538294360e7c4b3acb87c8268e4d0a4828a6500b1eff50061 \
                chown -R "$owner" /ws || true
            fi
          fi

      # `VERSION` is three release-please outputs joined by dots. If one is
      # missing the join still succeeds and yields `..`, which every step below
      # accepts: the build labels the image `v..` and the promote step creates
      # that tag. Checked before the build rather than after, so a renamed
      # output costs a failed step and not a released image nobody can pin.
      - name: Verify the release version resolved
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Website release version did not resolve: '$VERSION'" >&2
            exit 1
          fi

      # renovate: datasource=github-actions depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.website-sha }}

      # The guard above proves `VERSION` is well-formed, not that it belongs to
      # the source now checked out. `website-sha` is the release commit that
      # bumped this file, so the two agree by construction — and if they ever
      # disagree, the outputs came from different releases and the tag would
      # name an image built from something else.
      - name: Verify the checkout is the release it tags
        shell: bash
        run: |
          set -euo pipefail
          source_version="$(tr -d '[:space:]' < docs/website/version.txt)"
          if [[ "$source_version" != "$VERSION" ]]; then
            echo "Checked-out website is $source_version but the release is $VERSION" >&2
            exit 1
          fi

      # renovate: datasource=github-actions depName=docker/setup-buildx-action
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver-opts: |
            memory=6g
            memory-swap=6g
            cpu-period=100000
            cpu-quota=300000

      - name: Log in to ghcr.io
        # renovate: datasource=github-actions depName=docker/login-action
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resume an existing immutable website image
        id: existing-website
        env:
          SOURCE_SHA: ${{ needs.release-please.outputs.website-sha }}
        shell: bash
        run: |
          set -euo pipefail
          target="${REGISTRY}/${IMAGE_NAME}:v${VERSION}"
          if digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$target" 2>&1)"; then
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            image="${REGISTRY}/${IMAGE_NAME}@${digest}"
            docker pull "$image"
            revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")"
            [[ "$revision" == "$SOURCE_SHA" ]] || {
              echo '::error::Published website image has a different source revision.' >&2
              exit 1
            }
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          elif ! grep -qiE 'not found|manifest unknown|404' <<< "$digest"; then
            echo "::error::Could not inspect existing website image: $digest" >&2
            exit 1
          fi

      # Pushed by digest and tagged only after the smoke passes, exactly as the
      # per-commit publish does: a version tag is the thing the k8s manifest
      # pins, so it must never name an image that was never proven to serve.
      - name: Build and publish untagged image digest
        id: build
        if: steps.existing-website.outputs.digest == ''
        # renovate: datasource=github-actions depName=docker/build-push-action
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docs/website/Dockerfile
          platforms: linux/amd64
          outputs: >-
            type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: REQUIRE_APPLE_ASSOCIATION=true
          secrets: |
            apple_team_id=${{ secrets.APPLE_TEAM_ID }}
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.release-please.outputs.website-sha }}
            org.opencontainers.image.version=v${{ env.VERSION }}

      - name: Smoke-test published digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.existing-website.outputs.digest || steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          deploy/bin/verity-website-smoke \
            "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}" "$TEST_CONTAINER"

      # No `latest`. The per-commit publish deliberately has no mutable tag to
      # race, and the deployment pins a version anyway — a floating tag here
      # would be a second, unpinned way into the cluster.
      #
      # Re-running a failed release job is how a release that lost one image is
      # recovered, so `v${VERSION}` is created rather than claimed once. But a
      # release that already published has nothing to recover, and the cluster
      # pins this tag by name: moving it under a running deployment is invisible
      # to ArgoCD, so running pods keep the old digest while new ones get the
      # new. Serialization does not help — that is a re-run, not a race. So the
      # tag is only written when it is absent or already ours; a publish that
      # genuinely has to replace a released image is a new patch version.
      - name: Promote tested digest
        if: steps.existing-website.outputs.digest == ''
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.existing-website.outputs.digest || steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          version_target="${REGISTRY}/${IMAGE_NAME}:v${VERSION}"
          # Sets `inspect_output` to the digest on success and to the error text
          # on failure, because the two have to be told apart: "no such tag" is
          # the normal case for a first publish, and every other failure is a
          # read we did not get an answer from.
          inspect_output=''
          inspect_tag() {
            inspect_output="$(
              docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$1" 2>&1
            )"
          }
          if inspect_tag "$version_target"; then
            existing="$inspect_output"
          elif grep -qiE 'not found|manifest unknown|404' <<<"$inspect_output"; then
            # Only an explicit absence is safe to promote. Authentication and
            # authorization failures leave the existing digest unknown and must
            # fail closed before the immutable version tag can be touched.
            existing=''
          else
            # Treating an unreadable registry as an absent tag is how a guard
            # against overwriting a released tag overwrites one.
            echo "Could not read $version_target: $inspect_output" >&2
            echo "Refusing to tag without knowing whether one is already published." >&2
            exit 1
          fi
          if [[ -n "$existing" && "$existing" != "$IMAGE_DIGEST" ]]; then
            echo "$version_target already published $existing." >&2
            echo "That tag was created from a digest this job had already smoked, so" >&2
            echo "the release is complete even if a later step failed. To publish" >&2
            echo "different content, release a patch version; to genuinely replace" >&2
            echo "this one, delete the tag in the registry first and re-run." >&2
            exit 1
          fi
          docker buildx imagetools create \
            --tag "$version_target" \
            "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          # Read back before reporting success. This image is deliberately
          # outside the release audit (scripts/audit-release-images.mjs), so
          # nothing downstream ever asks again whether the tag the release
          # created resolves — and a `website-vX.Y.Z` tag with no image behind
          # it is a pin the cluster cannot satisfy.
          #
          # Resolving at all is the failure; resolving to a different digest is
          # only a warning. Whether `imagetools create` republishes an index
          # under its own digest or copies the source one is a buildx detail
          # this repository has never had to know — and the tag is already
          # written by the time we could find out, so failing on it would turn a
          # published release into one that reports failure and, by the guard
          # above, can no longer be re-run.
          # Retried: a tag that has just been written and a registry that is
          # briefly unreadable look the same from here, and the failure exit is
          # the expensive one — the guard above then refuses the re-run of a
          # release that did publish.
          resolved=''
          for attempt in 1 2 3; do
            if inspect_tag "$version_target"; then
              resolved="$inspect_output"
              break
            fi
            sleep $((attempt * 5))
          done
          if [[ -z "$resolved" ]]; then
            echo "Tag $version_target does not resolve after promotion: $inspect_output" >&2
            exit 1
          fi
          if [[ "$resolved" != "$IMAGE_DIGEST" ]]; then
            echo "::warning::$version_target resolves to $resolved, not the built $IMAGE_DIGEST"
          fi
          {
            echo "## Verity website"
            echo
            echo "\`$version_target\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Release immutability is enforced by the organization. Release Please
      # must therefore create a draft, which stays mutable while the image is
      # built and verified. Publish it only after the immutable image tag is in
      # place. Recovery resumes the same draft and source identity.
      - name: Publish verified website release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: website-v${{ needs.release-please.outputs.website-version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" == true ]]; then
            gh release edit "$TAG" --draft=false --latest=false
          fi

  self-update-gate:
    # ADR 0008 names the live cutover smoke as the release condition for managed
    # deployments, and a managed deployment installs what this workflow publishes
    # without anyone watching. A broken cutover is the one defect that also breaks
    # the channel a fix would arrive on, so it must not be publishable.
    #
    # Call the smoke only after release-please says this commit actually ships.
    # A direct reusable-workflow dependency is the verdict: it needs no REST
    # discovery loop, cannot select an unrelated manual run, and occupies no
    # second runner merely to poll the first one.
    needs: release-please
    if: needs.release-please.outputs.backend-release-created == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/self-update.yml
    with:
      candidate-sha: ${{ needs.release-please.outputs.backend-sha }}
      schema-forward-max: ${{ inputs['backend-schema-forward-max'] || '' }}
      allow-no-rollback: ${{ github.event_name == 'workflow_dispatch' && inputs['backend-accept-no-rollback'] && inputs['backend-republish'] }}

  publish-toolkit:
    needs: [release-please, self-update-gate, prepare-server-build-context]
    if: needs.release-please.outputs.backend-release-created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.release-please.outputs.backend-version }}
    steps:
      - name: Repair workspace ownership
        working-directory: /
        run: |
          set -euo pipefail
          if [[ -d "${GITHUB_WORKSPACE:-}" ]]; then
            owner="$(id -u):$(id -g)"
            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              sudo -n chown -R "$owner" "$GITHUB_WORKSPACE" || true
            elif command -v docker >/dev/null 2>&1; then
              docker run --rm -v "$GITHUB_WORKSPACE":/ws \
                python:3.14-slim@sha256:44dd04494ee8f3b538294360e7c4b3acb87c8268e4d0a4828a6500b1eff50061 \
                chown -R "$owner" /ws || true
            else
              chown -R "$owner" "$GITHUB_WORKSPACE" 2>/dev/null || true
            fi
          fi

      # renovate: datasource=github-actions depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.backend-sha }}
          fetch-depth: 0

      # renovate: datasource=github-actions depName=actions/setup-node
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'

      # Reuse the same trusted binaries and boundary ledger as both Server builds.
      # renovate: datasource=github-actions depName=actions/download-artifact
      - name: Download trusted Server build context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trusted-server-build-context-v${{ env.VERSION }}
          path: features/verity-sandbox-toolkit

      # Stamp the shared release version into the manifest BEFORE devcontainers/action
      # reads it (the Feature publish tags from the manifest `version`).
      #
      # The provenance revision goes under `customizations`, the one free-form
      # object the Feature schema permits: devcontainers/action validates this
      # file against a schema with `additionalProperties: false`, so a top-level
      # key of our own fails the publish outright ("Failed to validate Feature
      # metadata") and takes the whole backend release down with it. Everything
      # in this file — `customizations` included — is serialized verbatim into
      # the published `dev.containers.metadata` annotation, which is what the
      # channel-tag step below reads back.
      - name: Stamp release version into manifest
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const f="features/verity-sandbox-toolkit/devcontainer-feature.json";const j=require("./"+f);j.version=process.argv[1];j.customizations={...j.customizations,verity:{...j.customizations?.verity,sourceRevision:process.argv[2]}};require("node:fs").writeFileSync(f,JSON.stringify(j,null,2)+"\n")' "$VERSION" "$(git rev-parse HEAD)"
          echo "stamped toolkit version = $VERSION"

      # THE canonical note for why release.yml keeps the DEFAULT ephemeral
      # builder while ci.yml, verity-server.yml, verity-sandbox.yml and
      # project-relay.yml pin the persistent `verity-ci-bounded-v1` one; the other four
      # setup-buildx steps in this file point back here. This is deliberate
      # asymmetry, not an oversight — do not "align" it.
      #
      # The persistent builder is shared by every PR build on the host, and a
      # BuildKit cache entry is keyed by the build inputs while its RESULT is
      # whatever the build that first produced that key wrote. Reusing it across
      # PRs is fine: everyone can already run code on these runners. Reusing it
      # in the jobs that PUSH and SIGN the release artifacts is a different
      # question, and the answer costs a few minutes per release rather than
      # anything ongoing — a release runs on a tag, not per push. The published
      # image is assembled only from layers this job built or pulled, plus the
      # `type=gha` entries main wrote, and never from a local store an unmerged
      # branch could have written into.
      #
      # This particular job also builds nothing at all: buildx is here for
      # `docker buildx imagetools create` on the toolkit channel tags, which
      # talks to the registry and has no local cache to keep.
      # renovate: datasource=github-actions depName=docker/setup-buildx-action
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver-opts: |
            memory=6g
            memory-swap=6g
            cpu-period=100000
            cpu-quota=300000

      # Authenticate to ghcr BEFORE publishing — devcontainers/action shells out to
      # the `devcontainer features publish` CLI, which reads ambient docker/OCI
      # credentials. Without this login it runs anonymously and ghcr returns 403.
      - name: Log in to ghcr.io
        # renovate: datasource=github-actions depName=docker/login-action
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Feature publisher also updates mutable semver aliases. A bridge uses
      # the locally bundled Feature and must not roll those aliases backward.
      # renovate: datasource=github-actions depName=devcontainers/action
      - name: Publish verity-sandbox-toolkit
        if: ${{ !inputs['backend-artifact-only'] }}
        uses: devcontainers/action@1082abd5d2bf3a11abccba70eef98df068277772 # v1.4.3
        with:
          publish-features: 'true'
          base-path-to-features: features
          features-namespace: heey-global/verity
          oci-registry: ghcr.io
          disable-repo-tagging: 'true'

      - name: Publish toolkit channel tags
        if: ${{ !inputs['backend-artifact-only'] }}
        shell: bash
        run: |
          set -euo pipefail
          image=ghcr.io/heey-global/verity/verity-sandbox-toolkit
          numeric="${image}:${VERSION}"
          source_sha="$(git rev-parse HEAD)"
          docker buildx imagetools inspect --raw "$numeric" | \
            jq -e --arg sha "$source_sha" '.annotations["dev.containers.metadata"] | fromjson | .customizations.verity.sourceRevision == $sha' >/dev/null
          digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$numeric")"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          if existing="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${image}:v${VERSION}" 2>&1)"; then
            [[ "$existing" == "$digest" ]] || {
              echo '::error::Toolkit version alias differs from its immutable Feature.' >&2
              exit 1
            }
          elif grep -qiE 'not found|manifest unknown|404' <<< "$existing"; then
            docker buildx imagetools create --prefer-index=false \
              -t "${image}:v${VERSION}" "${image}@${digest}"
          else
            echo "::error::Cannot resolve toolkit version: $existing" >&2
            exit 1
          fi
          docker buildx imagetools create --prefer-index=false \
            -t "${image}:latest" "${image}@${digest}"

  prepare-server-build-context:
    # These local compiler/ledger inputs do not consume published images. Prepare
    # them during the smoke; build-server still waits for the gate and siblings.
    needs: release-please
    if: needs.release-please.outputs.backend-release-created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # renovate: datasource=github-actions depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.backend-sha }}
          fetch-depth: 0

      # renovate: datasource=github-actions depName=actions/setup-node
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'

      # The compiler image is intentionally linux/amd64 but emits both target
      # binaries. Run it once here, then give both native image builds the exact
      # same trusted bytes and compatibility ledger.
      # renovate: datasource=github-actions depName=docker/setup-buildx-action
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver-opts: |
            memory=6g
            memory-swap=6g
            cpu-period=100000
            cpu-quota=300000

      - name: Build attested script sandbox artifacts
        run: scripts/build-script-sandbox-prebuilts.sh

      - name: Assemble toolkit compatibility ledger
        run: node scripts/update-toolkit-ledger.mjs

      # renovate: datasource=github-actions depName=actions/upload-artifact
      - name: Upload trusted Server build context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-server-build-context-v${{ needs.release-please.outputs.backend-version }}
          path: |
            features/verity-sandbox-toolkit/prebuilt/linux-amd64/verity-script-sandbox
            features/verity-sandbox-toolkit/prebuilt/linux-arm64/verity-script-sandbox
            features/verity-sandbox-toolkit/prebuilt/sha256sums.txt
            features/verity-sandbox-toolkit/published-hashes.json
          if-no-files-found: error
          retention-days: 1

  build-server:
    needs:
      [
        release-please,
        self-update-gate,
        publish-project-relay,
        publish-sandbox,
        publish-toolkit,
        prepare-server-build-context,
      ]
    if: needs.release-please.outputs.backend-release-created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: heey-global/verity/verity-server
      VERSION: ${{ needs.release-please.outputs.backend-version }}
      SCHEMA_FORWARD_MAX: ${{ github.event_name == 'workflow_dispatch' && inputs['backend-schema-forward-max'] || '' }}
    steps:
      - name: Repair workspace ownership
        working-directory: /
        run: |
          set -euo pipefail
          if [[ -d "${GITHUB_WORKSPACE:-}" ]]; then
            owner="$(id -u):$(id -g)"
            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              sudo -n chown -R "$owner" "$GITHUB_WORKSPACE" || true
            elif command -v docker >/dev/null 2>&1; then
              docker run --rm -v "$GITHUB_WORKSPACE":/ws \
                python:3.14-slim@sha256:44dd04494ee8f3b538294360e7c4b3acb87c8268e4d0a4828a6500b1eff50061 \
                chown -R "$owner" /ws || true
            fi
          fi

      # renovate: datasource=github-actions depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.backend-sha }}
          fetch-depth: 0

      # renovate: datasource=github-actions depName=actions/setup-node
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'

      # renovate: datasource=github-actions depName=actions/download-artifact
      - name: Download trusted Server build context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trusted-server-build-context-v${{ env.VERSION }}
          path: features/verity-sandbox-toolkit

      # renovate: datasource=github-actions depName=docker/setup-buildx-action
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver-opts: |
            memory=6g
            memory-swap=6g
            cpu-period=100000
            cpu-quota=300000

      - name: Log in to ghcr.io
        # renovate: datasource=github-actions depName=docker/login-action
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the bundled PostgreSQL pin
        id: postgres
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t pins < <(sed -nE 's/^[[:space:]]*image:[[:space:]]*(postgres:[^[:space:]]+@sha256:[0-9a-f]{64})[[:space:]]*$/\1/p' deploy/docker-compose.yml)
          if [[ ${#pins[@]} -ne 1 ]]; then
            echo "expected exactly one digest-pinned postgres image in deploy/docker-compose.yml, found ${#pins[@]}" >&2
            exit 1
          fi
          echo "image=${pins[0]}" >> "$GITHUB_OUTPUT"

      - name: Compute architecture tag
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=12 HEAD)"
          echo "tag=${REGISTRY}/${IMAGE_NAME}:sha-${short_sha}-${{ matrix.architecture }}" >> "$GITHUB_OUTPUT"

      - name: Build + push (linux/${{ matrix.architecture }})
        # renovate: datasource=github-actions depName=docker/build-push-action
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/${{ matrix.architecture }}
          push: true
          tags: ${{ steps.tags.outputs.tag }}
          build-args: |
            VERITY_SERVER_VERSION=${{ env.VERSION }}
            VERITY_SCHEMA_FORWARD_MAX=${{ env.SCHEMA_FORWARD_MAX }}
            VERITY_BUNDLED_PROJECT_RELAY_IMAGE=${{ needs.publish-project-relay.outputs.image }}
            VERITY_BUNDLED_POSTGRES_IMAGE=${{ steps.postgres.outputs.image }}
            GOOGLE_AUTH_ID=${{ vars.GOOGLE_AUTH_ID || '340053543157-ohufghcdnc5do2lkjg7cgnkk67oac0e7.apps.googleusercontent.com' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.release-please.outputs.backend-sha }}
            org.opencontainers.image.version=v${{ env.VERSION }}
          # Export only final-image layers, with a bounded optional cache write.
          # Cold intermediate dependency/compile stages may rebuild on later runs.
          cache-from: type=gha,scope=verity-server-${{ matrix.architecture }}
          cache-to: type=gha,mode=min,timeout=60s,scope=verity-server-${{ matrix.architecture }},ignore-error=true

  publish-server:
    # Also gated on the sandbox image and toolkit Feature, not just the relay: a
    # released server resolves BOTH of those at its OWN version rather than at
    # `:latest`, so publishing a server whose siblings failed would ship an image
    # pointing at tags that do not exist. Same `if` on all three, so this only
    # ever orders jobs that were going to run anyway.
    needs:
      [
        release-please,
        self-update-gate,
        publish-project-relay,
        publish-sandbox,
        publish-toolkit,
        build-server,
      ]
    if: needs.release-please.outputs.backend-release-created == 'true'
    runs-on: ubuntu-24.04
    # Bounded below the janitor's cache grace period — see the note on
    # ci.yml's `server-image` job.
    timeout-minutes: 45
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      packages: write
      # Keyless Sigstore signing binds the image to this repository, ref, and
      # workflow file. The architecture jobs below separately sign each channel.
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: heey-global/verity/verity-server
      VERSION: ${{ needs.release-please.outputs.backend-version }}
      SCHEMA_FORWARD_MAX: ${{ github.event_name == 'workflow_dispatch' && inputs['backend-schema-forward-max'] || '' }}
    steps:
      - name: Repair workspace ownership
        working-directory: /
        run: |
          set -euo pipefail
          if [[ -d "${GITHUB_WORKSPACE:-}" ]]; then
            owner="$(id -u):$(id -g)"
            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              sudo -n chown -R "$owner" "$GITHUB_WORKSPACE" || true
            elif command -v docker >/dev/null 2>&1; then
              docker run --rm -v "$GITHUB_WORKSPACE":/ws \
                python:3.14-slim@sha256:44dd04494ee8f3b538294360e7c4b3acb87c8268e4d0a4828a6500b1eff50061 \
                chown -R "$owner" /ws || true
            else
              chown -R "$owner" "$GITHUB_WORKSPACE" 2>/dev/null || true
            fi
          fi

      # renovate: datasource=github-actions depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.backend-sha }}
          fetch-depth: 0

      # renovate: datasource=github-actions depName=actions/setup-node
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'

      # The Server image is the runtime trust root. Assemble the ledger again in
      # this job's checkout so the Docker build context contains the same complete
      # release history as the Feature published by its sibling job.
      # Default ephemeral builder, on purpose — see the note on the setup-buildx
      # step in `publish-toolkit` above for why the release jobs do not use the
      # persistent `verity-ci-bounded-v1` builder the PR image jobs share.
      # renovate: datasource=github-actions depName=docker/setup-buildx-action
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver-opts: |
            memory=6g
            memory-swap=6g
            cpu-period=100000
            cpu-quota=300000

      - name: Log in to ghcr.io
        # renovate: datasource=github-actions depName=docker/login-action
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          IMAGE_VERSION="v${VERSION}"
          {
            echo "tags<<EOF"
            echo "${REGISTRY}/${IMAGE_NAME}:${IMAGE_VERSION}"
            if [[ "${{ inputs.backend-artifact-only }}" != true ]]; then
              echo "${REGISTRY}/${IMAGE_NAME}:sha-${SHORT_SHA}"
              echo "${REGISTRY}/${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # The control-plane PostgreSQL pin this release will carry as an OCI label
      # (ADR 0008 D14). Read straight out of `deploy/docker-compose.yml` rather
      # than kept anywhere else, so the line Renovate already bumps stays the one
      # source of truth and no release can ship a label that disagrees with the
      # compose file a fresh install bootstraps from.
      - name: Resolve the bundled PostgreSQL pin
        id: postgres
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t pins < <(sed -nE 's/^[[:space:]]*image:[[:space:]]*(postgres:[^[:space:]]+@sha256:[0-9a-f]{64})[[:space:]]*$/\1/p' deploy/docker-compose.yml)
          if [[ ${#pins[@]} -ne 1 ]]; then
            echo "expected exactly one digest-pinned postgres image in deploy/docker-compose.yml, found ${#pins[@]}" >&2
            exit 1
          fi
          echo "image=${pins[0]}" >> "$GITHUB_OUTPUT"

      # Recovery tooling follows the workflow revision, not the older candidate.
      # renovate: datasource=github-actions depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts
          persist-credentials: false

      - name: Publish multi-architecture Server index
        id: build
        shell: bash
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=12 HEAD)"
          image="${REGISTRY}/${IMAGE_NAME}"
          IMAGE="$image" VERSION="$VERSION" SOURCE_SHA='${{ needs.release-please.outputs.backend-sha }}' \
            node .release-tools/scripts/publish-release-index.mjs \
              "${image}:sha-${short_sha}-amd64" "${image}:sha-${short_sha}-arm64"
          if [[ "${{ inputs.backend-artifact-only }}" != true ]]; then
            docker buildx imagetools create \
              -t "${image}:sha-${short_sha}" -t "${image}:latest" "${image}:v${VERSION}"
          fi
          digest="$(docker buildx imagetools inspect "${image}:v${VERSION}" --format '{{ .Manifest.Digest }}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # A retry reuses the immutable index and its valid existing provenance.
      # renovate: datasource=github-actions depName=sigstore/cosign-installer
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Detect existing Server provenance
        id: existing-provenance
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          if cosign verify-attestation --type https://slsa.dev/provenance/v1 \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main" \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" >/dev/null 2>&1; then
            echo 'verified=true' >> "$GITHUB_OUTPUT"
          fi

      # GitHub signs an in-toto SLSA provenance statement for the immutable
      # image digest and stores the attestation both with the repository and as
      # an OCI referrer. The release evidence below exports that same statement;
      # it never synthesizes provenance from mutable tags.
      # renovate: datasource=github-actions depName=actions/attest
      - name: Attest Server image provenance
        if: steps.existing-provenance.outputs.verified != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # renovate: datasource=github-actions depName=sigstore/cosign-installer
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the Server image
        shell: bash
        env:
          SERVER_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Signed here rather than in the slice that consumes it: a signature
          # can only be attached while the release is being published, so an
          # image shipped without one could never be verified afterwards. The
          # Updater checks this before it pulls (ADR 0008 D4).
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${SERVER_DIGEST}"

  prepare-server-channels:
    needs: [release-please, publish-server]
    if: needs.release-please.outputs.backend-release-created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: heey-global/verity/verity-server
      VERSION: ${{ needs.release-please.outputs.backend-version }}
      SERVER_DIGEST: ${{ needs.publish-server.outputs.digest }}
      SOURCE_REVISION: ${{ needs.release-please.outputs.backend-sha }}
      REVISION: ${{ github.sha }}
    steps:
      # renovate: datasource=github-actions depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.backend-sha }}

      # renovate: datasource=github-actions depName=docker/setup-buildx-action
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver-opts: |
            memory=6g
            memory-swap=6g
            cpu-period=100000
            cpu-quota=300000

      - name: Log in to ghcr.io
        # renovate: datasource=github-actions depName=docker/login-action
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # renovate: datasource=github-actions depName=sigstore/cosign-installer
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # renovate: datasource=github-actions depName=oras-project/setup-oras
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Prepare signed architecture release channel
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          [[ "$SERVER_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_REVISION" ]]
          image="${REGISTRY}/${IMAGE_NAME}@${SERVER_DIGEST}"

          # The channel claims one architecture while retaining the shared index
          # digest. Prove the index can actually resolve that platform before the
          # image is allowed to render or sign the claim.
          docker buildx imagetools inspect --raw "$image" |
            jq -e --arg architecture "$ARCHITECTURE" \
              '.manifests | any(.platform.os == "linux" and .platform.architecture == $architecture)' >/dev/null

          workdir="$RUNNER_TEMP/server-release-evidence-${ARCHITECTURE}"
          mkdir -p "$workdir"
          docker run --rm --platform "linux/${ARCHITECTURE}" \
            -e VERITY_RELEASE_SERVER_IMAGE="$image" \
            -e VERITY_RELEASE_REVISION="$REVISION" \
            -e VERITY_RELEASE_ARCHITECTURE="$ARCHITECTURE" \
            -e VERITY_RELEASE_PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "$image" release-channel-metadata > "$workdir/payload.json"

          cosign sign-blob --yes --bundle "$workdir/bundle.json" "$workdir/payload.json"
          cosign verify-blob \
            --bundle "$workdir/bundle.json" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main" \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref refs/heads/main \
            --certificate-github-workflow-sha "$REVISION" \
            "$workdir/payload.json"

          predicate_type=https://slsa.dev/provenance/v1
          cosign verify-attestation \
            --type "$predicate_type" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main" \
            "$image" >/dev/null
          cosign download attestation --predicate-type "$predicate_type" "$image" \
            > "$workdir/verity-server-v${VERSION}.${ARCHITECTURE}.intoto.jsonl"
          test "$(wc -l < "$workdir/verity-server-v${VERSION}.${ARCHITECTURE}.intoto.jsonl")" -eq 1

          cp "$workdir/payload.json" \
            "$workdir/verity-server-v${VERSION}.${ARCHITECTURE}.release-channel.json"
          cp "$workdir/bundle.json" \
            "$workdir/verity-server-v${VERSION}.${ARCHITECTURE}.release-channel.sigstore.json"
          printf '{"payload":"%s","signature":{"kind":"sigstore-bundle","bundle":"%s"}}' \
            "$(base64 -w0 "$workdir/payload.json")" \
            "$(base64 -w0 "$workdir/bundle.json")" > "$workdir/channel.json"
          cp "$workdir/channel.json" "$workdir/verity-server-v${VERSION}.${ARCHITECTURE}.release-envelope.json"

      # renovate: datasource=github-actions depName=actions/upload-artifact
      - name: Upload architecture release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-release-evidence-v${{ env.VERSION }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/server-release-evidence-${{ matrix.architecture }}/*
          if-no-files-found: error
          retention-days: 7

  publish-server-channels:
    needs:
      [
        release-please,
        prepare-server-channels,
        publish-server-release-evidence,
        publish-preview-images,
      ]
    if: >-
      always() && !inputs['backend-artifact-only'] && needs.release-please.outputs.backend-release-created == 'true' &&
      needs.prepare-server-channels.result == 'success' &&
      needs.publish-preview-images.result == 'success' &&
      (needs.publish-server-release-evidence.result == 'success' ||
      (inputs['backend-republish'] && needs.publish-server-release-evidence.result == 'skipped'))
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      # renovate: datasource=github-actions depName=actions/download-artifact
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: server-release-evidence-v${{ needs.release-please.outputs.backend-version }}-*
          path: evidence
      # renovate: datasource=github-actions depName=oras-project/setup-oras
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      - name: Promote verified architecture channels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.backend-version }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username '${{ github.actor }}' --password-stdin
          for architecture in amd64 arm64; do
            directory="evidence/server-release-evidence-v${VERSION}-${architecture}"
            test -s "$directory/channel.json"
            (cd "$directory" && oras push \
              "ghcr.io/heey-global/verity/verity-server:channel-stable-${architecture}" \
              --artifact-type application/vnd.verity.release-channel.v1+json \
              channel.json:application/json)
          done

  publish-server-release-evidence:
    needs: [release-please, prepare-server-channels]
    if: >-
      needs.release-please.outputs.backend-release-created == 'true' &&
      !inputs['backend-republish']
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # This narrow job deliberately has no checkout. Tell gh what `.git`
      # therefore cannot, or the release upload fails before reaching GitHub.
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.release-please.outputs.backend-version }}
    steps:
      # renovate: datasource=github-actions depName=actions/download-artifact
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: server-release-evidence-v${{ env.VERSION }}-*
          path: evidence
          merge-multiple: true
      - name: Attach verified Sigstore evidence to the GitHub release
        shell: bash
        run: |
          set -euo pipefail
          for architecture in amd64 arm64; do
            payload="evidence/verity-server-v${VERSION}.${architecture}.release-channel.json"
            bundle="evidence/verity-server-v${VERSION}.${architecture}.release-channel.sigstore.json"
            provenance="evidence/verity-server-v${VERSION}.${architecture}.intoto.jsonl"
            envelope="evidence/verity-server-v${VERSION}.${architecture}.release-envelope.json"
            test -s "$payload"
            test -s "$bundle"
            test -s "$provenance"
            test -s "$envelope"
            jq -e --arg version "$VERSION" --arg architecture "$architecture" \
              '.version == $version and .architecture == $architecture' "$payload" >/dev/null
            gh release upload "v${VERSION}" "$payload" "$bundle" "$provenance" "$envelope" --clobber
          done

  build-sandbox:
    # Candidate SHA tags may build during acceptance; version publication stays gated.
    needs: release-please
    if: needs.release-please.outputs.backend-release-created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Bounded below the janitor's cache grace period — see the note on
    # ci.yml's `server-image` job.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      # Legacy path (kept during namespace migration #475) + new namespaced path.
      IMAGE_NAME: heey-global/verity-sandbox
      IMAGE_NAME_NEW: heey-global/verity/verity-sandbox
      VERSION: ${{ needs.release-please.outputs.backend-version }}
    steps:
      - name: Repair workspace ownership
        working-directory: /
        run: |
          set -euo pipefail
          if [[ -d "${GITHUB_WORKSPACE:-}" ]]; then
            owner="$(id -u):$(id -g)"
            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              sudo -n chown -R "$owner" "$GITHUB_WORKSPACE" || true
            elif command -v docker >/dev/null 2>&1; then
              docker run --rm -v "$GITHUB_WORKSPACE":/ws \
                python:3.14-slim@sha256:44dd04494ee8f3b538294360e7c4b3acb87c8268e4d0a4828a6500b1eff50061 \
                chown -R "$owner" /ws || true
            else
              chown -R "$owner" "$GITHUB_WORKSPACE" 2>/dev/null || true
            fi
          fi

      # renovate: datasource=github-actions depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.backend-sha }}

      - name: Prepare hosted-runner disk
        uses: ./.github/actions/reclaim-runner-disk
        with:
          minimum-free-gib: '25'

      # Default ephemeral builder, on purpose — see the note on the setup-buildx
      # step in `publish-toolkit` above for why the release jobs do not use the
      # persistent `verity-ci-bounded-v1` builder the PR image jobs share.
      # renovate: datasource=github-actions depName=docker/setup-buildx-action
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver-opts: |
            memory=6g
            memory-swap=6g
            cpu-period=100000
            cpu-quota=300000

      - name: Log in to ghcr.io
        # renovate: datasource=github-actions depName=docker/login-action
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute temporary architecture tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          {
            echo "tags<<EOF"
            echo "${REGISTRY}/${IMAGE_NAME}:sha-${SHORT_SHA}-${{ matrix.architecture }}"
            echo "${REGISTRY}/${IMAGE_NAME_NEW}:sha-${SHORT_SHA}-${{ matrix.architecture }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build + push (linux/${{ matrix.architecture }})
        # renovate: datasource=github-actions depName=docker/build-push-action
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Repo root so `COPY features/verity-sandbox-toolkit` resolves.
          context: .
          file: deploy/verity-sandbox.Dockerfile
          platforms: linux/${{ matrix.architecture }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.release-please.outputs.backend-sha }}
            org.opencontainers.image.version=v${{ env.VERSION }}
            org.opencontainers.image.title=heey-global/verity-sandbox
            org.opencontainers.image.description=Verity project base image (plain base + verity-sandbox-toolkit Feature)
          # Scope matches verity-sandbox.yml's read-only build; see the note on the
          # `Build Verity server image` step in ci.yml.
          cache-from: type=gha,scope=verity-sandbox-${{ matrix.architecture }}
          cache-to: type=gha,mode=min,timeout=60s,scope=verity-sandbox-${{ matrix.architecture }},ignore-error=true

  publish-sandbox:
    needs: [release-please, self-update-gate, build-sandbox]
    if: needs.release-please.outputs.backend-release-created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: heey-global/verity-sandbox
      IMAGE_NAME_NEW: heey-global/verity/verity-sandbox
      VERSION: ${{ needs.release-please.outputs.backend-version }}
      SOURCE_REVISION: ${{ needs.release-please.outputs.backend-sha }}
    steps:
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver-opts: |
            memory=6g
            memory-swap=6g
            cpu-period=100000
            cpu-quota=300000

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Recovery tooling follows the workflow revision, not the older candidate.
      # renovate: datasource=github-actions depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts
          persist-credentials: false

      - name: Publish multi-architecture sandbox indexes
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${SOURCE_REVISION:0:12}"
          for image in "${REGISTRY}/${IMAGE_NAME}" "${REGISTRY}/${IMAGE_NAME_NEW}"; do
            IMAGE="$image" VERSION="$VERSION" SOURCE_SHA="$SOURCE_REVISION" \
              node .release-tools/scripts/publish-release-index.mjs \
                "${image}:sha-${short_sha}-amd64" "${image}:sha-${short_sha}-arm64"
            if [[ "${{ inputs.backend-artifact-only }}" != true ]]; then
              docker buildx imagetools create \
                -t "${image}:sha-${short_sha}" -t "${image}:latest" "${image}:v${VERSION}"
            fi
          done

  build-project-relay:
    # Candidate SHA tags may build during acceptance; version publication stays gated.
    needs: release-please
    if: needs.release-please.outputs.backend-release-created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Bounded below the janitor's cache grace period — see the note on
    # ci.yml's `server-image` job.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: heey-global/verity/verity-project-relay
      VERSION: ${{ needs.release-please.outputs.backend-version }}
    steps:
      - name: Repair workspace ownership
        working-directory: /
        run: |
          set -euo pipefail
          if [[ -d "${GITHUB_WORKSPACE:-}" ]]; then
            owner="$(id -u):$(id -g)"
            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              sudo -n chown -R "$owner" "$GITHUB_WORKSPACE" || true
            elif command -v docker >/dev/null 2>&1; then
              docker run --rm -v "$GITHUB_WORKSPACE":/ws \
                python:3.14-slim@sha256:44dd04494ee8f3b538294360e7c4b3acb87c8268e4d0a4828a6500b1eff50061 \
                chown -R "$owner" /ws || true
            else
              chown -R "$owner" "$GITHUB_WORKSPACE" 2>/dev/null || true
            fi
          fi

      # renovate: datasource=github-actions depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.backend-sha }}

      # The relay smoke harness uses host-side Node; provision it explicitly on
      # runner Docker daemons before validating the exact release image.
      # renovate: datasource=github-actions depName=actions/setup-node
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'

      # Default ephemeral builder, on purpose — see the note on the setup-buildx
      # step in `publish-toolkit` above for why the release jobs do not use the
      # persistent `verity-ci-bounded-v1` builder the PR image jobs share.
      # renovate: datasource=github-actions depName=docker/setup-buildx-action
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver-opts: |
            memory=6g
            memory-swap=6g
            cpu-period=100000
            cpu-quota=300000

      - name: Build exact release relay for smoke test
        # renovate: datasource=github-actions depName=docker/build-push-action
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/project-relay.Dockerfile
          platforms: linux/${{ matrix.architecture }}
          load: true
          tags: verity-project-relay:release-smoke
          # Same Dockerfile as the push step below and as project-relay.yml, so
          # deliberately the same scope; see the note on the `Build Verity server
          # image` step in ci.yml.
          # The push step reuses this builder and exports the cache once.
          cache-from: type=gha,scope=verity-project-relay-${{ matrix.architecture }}

      - name: Verify exact release relay confinement
        run: deploy/bin/verity-project-relay-smoke verity-project-relay:release-smoke

      - name: Remove release smoke image
        if: always()
        run: docker image rm -f verity-project-relay:release-smoke >/dev/null 2>&1 || true

      - name: Log in to ghcr.io
        # renovate: datasource=github-actions depName=docker/login-action
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute temporary architecture tag
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          {
            echo "tags<<EOF"
            echo "${REGISTRY}/${IMAGE_NAME}:sha-${SHORT_SHA}-${{ matrix.architecture }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build + push (linux/${{ matrix.architecture }})
        # renovate: datasource=github-actions depName=docker/build-push-action
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/project-relay.Dockerfile
          platforms: linux/${{ matrix.architecture }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.release-please.outputs.backend-sha }}
            org.opencontainers.image.version=v${{ env.VERSION }}
            org.opencontainers.image.title=heey-global/verity-project-relay
            org.opencontainers.image.description=Fixed-destination per-project Verity relay
          # See the note on the `Build Verity server image` step in ci.yml.
          cache-from: type=gha,scope=verity-project-relay-${{ matrix.architecture }}
          cache-to: type=gha,mode=min,timeout=60s,scope=verity-project-relay-${{ matrix.architecture }},ignore-error=true

  publish-project-relay:
    needs: [release-please, self-update-gate, build-project-relay]
    if: needs.release-please.outputs.backend-release-created == 'true'
    outputs:
      image: ${{ steps.relay-reference.outputs.image }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: heey-global/verity/verity-project-relay
      VERSION: ${{ needs.release-please.outputs.backend-version }}
      SOURCE_REVISION: ${{ needs.release-please.outputs.backend-sha }}
    steps:
      # renovate: datasource=github-actions depName=docker/setup-buildx-action
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver-opts: |
            memory=6g
            memory-swap=6g
            cpu-period=100000
            cpu-quota=300000

      - name: Log in to ghcr.io
        # renovate: datasource=github-actions depName=docker/login-action
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Recovery tooling follows the workflow revision, not the older candidate.
      # renovate: datasource=github-actions depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts
          persist-credentials: false

      - name: Publish multi-architecture relay index
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${SOURCE_REVISION:0:12}"
          image="${REGISTRY}/${IMAGE_NAME}"
          IMAGE="$image" VERSION="$VERSION" SOURCE_SHA='${{ needs.release-please.outputs.backend-sha }}' \
            node .release-tools/scripts/publish-release-index.mjs \
              "${image}:sha-${short_sha}-amd64" "${image}:sha-${short_sha}-arm64"
          if [[ "${{ inputs.backend-artifact-only }}" != true ]]; then
            docker buildx imagetools create \
              -t "${image}:sha-${short_sha}" -t "${image}:latest" "${image}:v${VERSION}"
          fi

      - name: Record digest-pinned relay reference
        id: relay-reference
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}"
          relay_digest="$(docker buildx imagetools inspect "${image}:v${VERSION}" --format '{{ .Manifest.Digest }}')"
          [[ "$relay_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          reference="${image}@${relay_digest}"
          echo "image=$reference" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$reference" > verity-project-relay-image.txt
          {
            echo '## Project broker relay'
            echo
            echo 'Bundled into the matching `verity-server` image:'
            echo
            echo "\`$reference\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest-pinned relay reference
        # renovate: datasource=github-actions depName=actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verity-project-relay-image
          path: verity-project-relay-image.txt
          if-no-files-found: error

  build-preview-images:
    # Preview images are not inputs to the stable Server image. Keep them behind
    # its signed channel publication so they cannot occupy the limited dev-server
    # runner slots needed by sandbox, toolkit, relay and Server. They still ship
    # in this release run, but update availability is no longer delayed by them.
    needs: [release-please, self-update-gate, publish-server]
    if: needs.release-please.outputs.backend-release-created == 'true'
    runs-on: ${{ matrix.runner }}
    # Bounded below the janitor's cache grace period — see the note on
    # ci.yml's `server-image` job.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: edge
            dockerfile: deploy/preview-edge.Dockerfile
            image: heey-global/verity/verity-preview-edge
            architecture: amd64
            runner: ubuntu-24.04
          - component: edge
            dockerfile: deploy/preview-edge.Dockerfile
            image: heey-global/verity/verity-preview-edge
            architecture: arm64
            runner: ubuntu-24.04-arm
          - component: connector
            dockerfile: deploy/preview-connector.Dockerfile
            image: heey-global/verity/verity-preview-connector
            architecture: amd64
            runner: ubuntu-24.04
          - component: connector
            dockerfile: deploy/preview-connector.Dockerfile
            image: heey-global/verity/verity-preview-connector
            architecture: arm64
            runner: ubuntu-24.04-arm
    env:
      REGISTRY: ghcr.io
      VERSION: ${{ needs.release-please.outputs.backend-version }}
    steps:
      - name: Repair workspace ownership
        working-directory: /
        run: |
          set -euo pipefail
          if [[ -d "${GITHUB_WORKSPACE:-}" ]]; then
            owner="$(id -u):$(id -g)"
            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              sudo -n chown -R "$owner" "$GITHUB_WORKSPACE" || true
            elif command -v docker >/dev/null 2>&1; then
              docker run --rm -v "$GITHUB_WORKSPACE":/ws \
                python:3.14-slim@sha256:44dd04494ee8f3b538294360e7c4b3acb87c8268e4d0a4828a6500b1eff50061 \
                chown -R "$owner" /ws || true
            fi
          fi

      # renovate: datasource=github-actions depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.backend-sha }}

      # Default ephemeral builder, on purpose — see the note on the setup-buildx
      # step in `publish-toolkit` above for why the release jobs do not use the
      # persistent `verity-ci-bounded-v1` builder the PR image jobs share.
      # renovate: datasource=github-actions depName=docker/setup-buildx-action
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver-opts: |
            memory=6g
            memory-swap=6g
            cpu-period=100000
            cpu-quota=300000

      - name: Log in to ghcr.io
        # renovate: datasource=github-actions depName=docker/login-action
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute architecture tag
        id: tags
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=12 HEAD)"
          echo "tag=${REGISTRY}/${{ matrix.image }}:sha-${short_sha}-${{ matrix.architecture }}" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        id: publish
        # renovate: datasource=github-actions depName=docker/build-push-action
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.architecture }}
          push: true
          tags: ${{ steps.tags.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.release-please.outputs.backend-sha }}
            org.opencontainers.image.version=v${{ env.VERSION }}
          # One scope per component and architecture; neither independent writer
          # may replace the other's index. See the note on the `Build Verity
          # server image` step in ci.yml.
          cache-from: type=gha,scope=preview-${{ matrix.component }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=min,timeout=60s,scope=preview-${{ matrix.component }}-${{ matrix.architecture }},ignore-error=true

  publish-preview-images:
    needs: [release-please, self-update-gate, publish-server, build-preview-images]
    if: needs.release-please.outputs.backend-release-created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: edge
            image: heey-global/verity/verity-preview-edge
          - component: connector
            image: heey-global/verity/verity-preview-connector
    env:
      REGISTRY: ghcr.io
      VERSION: ${{ needs.release-please.outputs.backend-version }}
      SOURCE_REVISION: ${{ needs.release-please.outputs.backend-sha }}
    steps:
      # renovate: datasource=github-actions depName=docker/setup-buildx-action
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver-opts: |
            memory=6g
            memory-swap=6g
            cpu-period=100000
            cpu-quota=300000

      - name: Log in to ghcr.io
        # renovate: datasource=github-actions depName=docker/login-action
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Recovery tooling follows the workflow revision, not the older candidate.
      # renovate: datasource=github-actions depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts
          persist-credentials: false

      - name: Publish multi-architecture preview index
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${SOURCE_REVISION:0:12}"
          image="${REGISTRY}/${{ matrix.image }}"
          IMAGE="$image" VERSION="$VERSION" SOURCE_SHA='${{ needs.release-please.outputs.backend-sha }}' \
            node .release-tools/scripts/publish-release-index.mjs \
              "${image}:sha-${short_sha}-amd64" "${image}:sha-${short_sha}-arm64"
          if [[ "${{ inputs.backend-artifact-only }}" != true ]]; then
            docker buildx imagetools create \
              -t "${image}:sha-${short_sha}" -t "${image}:latest" "${image}:v${VERSION}"
          fi
          digest="$(docker buildx imagetools inspect "${image}:v${VERSION}" --format '{{ .Manifest.Digest }}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Record immutable image reference
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          reference="${REGISTRY}/${{ matrix.image }}@${DIGEST}"
          printf '%s\n' "$reference" > "verity-preview-${{ matrix.component }}-image.txt"
          {
            echo "## Preview ${{ matrix.component }}"
            echo
            echo "\`$reference\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable image reference
        # renovate: datasource=github-actions depName=actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verity-preview-${{ matrix.component }}-image
          path: verity-preview-${{ matrix.component }}-image.txt
          if-no-files-found: error

  finalize-backend-release:
    needs:
      - release-please
      - publish-server
      - publish-server-release-evidence
      - publish-server-channels
      - publish-sandbox
      - publish-toolkit
      - publish-project-relay
      - publish-preview-images
    if: >-
      always() && needs.release-please.outputs.backend-release-created == 'true' &&
      !inputs['backend-republish'] &&
      needs.publish-server.result == 'success' &&
      needs.publish-server-release-evidence.result == 'success' &&
      (needs.publish-server-channels.result == 'success' ||
      (inputs['backend-artifact-only'] && needs.publish-server-channels.result == 'skipped')) &&
      needs.publish-sandbox.result == 'success' &&
      needs.publish-toolkit.result == 'success' &&
      needs.publish-project-relay.result == 'success' &&
      needs.publish-preview-images.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # This job has no checkout, so gh cannot infer the repository from .git.
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.release-please.outputs.backend-version }}
    steps:
      - name: Publish verified backend release
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          # Artifact-only bridges have no release-please PR; publish their pinned
          # draft without reconciling labels or marking them as the latest release.
          # release-please normally replaces this label while creating the
          # release. Recovery publishes an already-created draft without running
          # that action. Move the label first, then roll it back if publication
          # fails so either state remains retryable: pending+draft or tagged+public.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.backend-artifact-only }}" != true ]; then
            version="${TAG#v}"
            pr_numbers="$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls?state=closed&per_page=100" --jq \
              '.[] | select(.merged_at != null and .title == "chore(main): release server '"$version"'") | .number')"
            pr_count="$(awk 'NF { count++ } END { print count + 0 }' <<< "$pr_numbers")"
            if [ "$pr_count" -ne 1 ]; then
              echo "::error::Expected exactly one release PR for $TAG, found $pr_count." >&2
              exit 1
            fi
            pr_number="$pr_numbers"
            require_release_labels() {
              expected_pending="$1"
              expected_tagged="$2"
              labels="$(gh api \
                "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/labels" --jq '.[].name')"
              pending=false
              tagged=false
              grep -Fxq 'autorelease: pending' <<< "$labels" && pending=true
              grep -Fxq 'autorelease: tagged' <<< "$labels" && tagged=true
              if [ "$pending" != "$expected_pending" ] || [ "$tagged" != "$expected_tagged" ]; then
                echo "::error::Release PR labels are pending=$pending tagged=$tagged; expected pending=$expected_pending tagged=$expected_tagged." >&2
                return 1
              fi
            }
            labels="$(gh api \
              "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/labels" --jq '.[].name')"
            pending=false
            tagged=false
            grep -Fxq 'autorelease: pending' <<< "$labels" && pending=true
            grep -Fxq 'autorelease: tagged' <<< "$labels" && tagged=true
            if [ "$pending" = false ] && [ "$tagged" = false ]; then
              echo "::error::Release PR has neither pending nor tagged label." >&2
              exit 1
            fi
            if [ "$tagged" = false ]; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/labels" \
                -f 'labels[]=autorelease: tagged'
            fi
            if [ "$pending" = true ]; then
              # Both labels means an earlier attempt stopped after the idempotent
              # add. Removing pending resumes that transition safely.
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/labels/autorelease%3A%20pending"
            fi
            require_release_labels false true

            publish_status=0
            gh release edit "$TAG" --draft=false --latest=false || publish_status=$?
            lookup_status=0
            is_draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft')" || lookup_status=$?
            if [ "$lookup_status" -ne 0 ]; then
              # Leave tagged-only in place: the release edit may have succeeded,
              # and the next recovery attempt can safely resume this state.
              exit "$lookup_status"
            fi
            if [ "$is_draft" = "true" ]; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/labels" \
                -f 'labels[]=autorelease: pending'
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/labels/autorelease%3A%20tagged" || delete_status=$?
              require_release_labels true false
              [ "$publish_status" -ne 0 ] || publish_status=1
              exit "${publish_status:-1}"
            fi
            require_release_labels false true
          else
            gh release edit "$TAG" --draft=false --latest=false
          fi

      # Planning and publication are separate modes, so the push that published
      # this version could not also plan the next one, and nothing re-runs
      # planning on its own. Without this dispatch, source commits merged before
      # this release sit on main with no release PR until an unrelated later push
      # happens to plan one — silently, with no failed run to notice. The
      # publication above cleared the draft this planning run refuses to pass.
      # The dispatcher only ever publishes from a push to main, so planning
      # targets that same branch rather than this run's release tag.
      - name: Plan the next backend release
        if: github.event_name == 'push'
        shell: bash
        run: gh workflow run release-dispatch.yml --ref main -f backend-replan=true
