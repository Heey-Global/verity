          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.release-please.outputs.backend-sha }}
            org.opencontainers.image.version=v${{ env.VERSION }}
          # One scope per component and architecture; neither independent writer
          # may replace the other's index. See the note on the `Build Verity
          # server image` step in ci.yml.
          cache-from: type=gha,scope=preview-${{ matrix.component }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=min,timeout=60s,scope=preview-${{ matrix.component }}-${{ matrix.architecture }},ignore-error=true

  publish-preview-images:
    needs: [release-please, self-update-gate, publish-server, build-preview-images]
    if: needs.release-please.outputs.backend-release-created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: edge
            image: heey-global/verity/verity-preview-edge
          - component: connector
            image: heey-global/verity/verity-preview-connector
    env:
      REGISTRY: ghcr.io
      VERSION: ${{ needs.release-please.outputs.backend-version }}
      SOURCE_REVISION: ${{ needs.release-please.outputs.backend-sha }}
    steps:
      # renovate: datasource=github-actions depName=docker/setup-buildx-action
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: |
            memory=6g
            memory-swap=6g
            cpu-period=100000
            cpu-quota=300000

      - name: Log in to ghcr.io
        # renovate: datasource=github-actions depName=docker/login-action
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-architecture preview index
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${SOURCE_REVISION:0:12}"
          image="${REGISTRY}/${{ matrix.image }}"
          docker buildx imagetools create \
            -t "${image}:v${VERSION}" \
            -t "${image}:sha-${short_sha}" \
            -t "${image}:latest" \
            "${image}:sha-${short_sha}-amd64" \
            "${image}:sha-${short_sha}-arm64"
          digest="$(docker buildx imagetools inspect "${image}:v${VERSION}" --format '{{ .Manifest.Digest }}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Record immutable image reference
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          reference="${REGISTRY}/${{ matrix.image }}@${DIGEST}"
          printf '%s\n' "$reference" > "verity-preview-${{ matrix.component }}-image.txt"
          {
            echo "## Preview ${{ matrix.component }}"
            echo
            echo "\`$reference\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable image reference
        # renovate: datasource=github-actions depName=actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verity-preview-${{ matrix.component }}-image
          path: verity-preview-${{ matrix.component }}-image.txt
          if-no-files-found: error

  finalize-backend-release:
    needs:
      - release-please
      - publish-server
      - publish-server-release-evidence
      - publish-sandbox
      - publish-toolkit
      - publish-project-relay
      - publish-preview-images
    if: >-
      needs.release-please.outputs.backend-release-created == 'true' &&
      !inputs['backend-republish'] &&
      needs.publish-server.result == 'success' &&
      needs.publish-server-release-evidence.result == 'success' &&
      needs.publish-sandbox.result == 'success' &&
      needs.publish-toolkit.result == 'success' &&
      needs.publish-project-relay.result == 'success' &&
      needs.publish-preview-images.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # This job has no checkout, so gh cannot infer the repository from .git.
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.release-please.outputs.backend-version }}
    steps:
      - name: Publish verified backend release
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          gh release edit "$TAG" --draft=false --latest=false
