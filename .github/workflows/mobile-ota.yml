name: verity-mobile-ota

# Relevant main merges update a Release Please Staging OTA PR. Only merging
# that PR publishes its fixed patch version and updates the production proposal.
# Native changes still require a separate native TestFlight release first.

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/mobile/**'
      - 'packages/events/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/mobile-ota-release.ts'
      - 'scripts/mobile-native-compatibility.mjs'
      - 'scripts/mobile-ota-proposal.mjs'
      - 'release-please-config.mobile-ota.json'
      - '.release-please-manifest.mobile-ota.json'
  # A delivered promotion strands any candidate staged after its approval, and
  # its own commit is the only push that follows. The promotion workflow asks
  # for the restage that no push would trigger.
  workflow_dispatch:

permissions: read-all

concurrency:
  # Never cancel an in-flight publish: a cancelled `eas update` can leave a
  # half-rolled-out update. Serialize back-to-back merges instead of racing them.
  group: mobile-ota-staging
  queue: max
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    # A stalled Metro export / EAS publish must not hold the serialized release
    # slot indefinitely.
    timeout-minutes: 30
    steps:
      # renovate: datasource=github-actions depName=actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect commits owned by another mobile workflow
        id: release-kind
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^ HEAD)"
          # A dispatch is the promotion workflow asking to restage onto exactly
          # this commit, so its manifest change is an expected source here.
          if [[ "$changed" == 'apps/mobile/ota-promotion.json' && "$GITHUB_EVENT_NAME" == 'push' ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "OTA promotion commit detected; the promotion workflow owns it."
          elif ! git diff --quiet HEAD^ HEAD -- apps/mobile/version.txt; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Native mobile release commit detected; its TestFlight workflow owns this version."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconcile the latest main source
        if: steps.release-kind.outputs.skip != 'true'
        run: |
          git fetch origin main:refs/remotes/origin/main
          git checkout --detach origin/main

      - name: Detect merged Staging OTA release
        if: steps.release-kind.outputs.skip != 'true'
        id: intent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/mobile-ota-proposal.mjs detect

      - name: Check out the immutable merged release source
        if: steps.intent.outputs.mode == 'stage'
        run: git checkout --detach '${{ steps.intent.outputs.commit }}'

      - name: Require Expo release configuration
        if: steps.intent.outputs.mode == 'stage'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::EXPO_TOKEN secret is not set — add an Expo access token (expo.dev -> access tokens) as a repository secret so the OTA publish can authenticate." >&2
            exit 1
          fi

      # renovate: datasource=github-actions depName=actions/setup-node
      - if: steps.release-kind.outputs.skip != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          # Deliberately no `cache: npm`; the roughly 2 GB archive competes with
          # the BuildKit entries used by release image jobs.

      - if: steps.release-kind.outputs.skip != 'true'
        run: npm ci

      # apps/mobile bundles @verity/mobile from its built dist (the mobile-app CI
      # job builds it before its checks for the same reason), so build the workspace
      # dependency before Metro exports the update bundle.
      - if: steps.intent.outputs.mode == 'stage'
        run: npm run -w @verity/mobile build

      - name: Verify published native runtime compatibility
        if: steps.release-kind.outputs.skip != 'true'
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          native_tag="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == false) | .tag_name' \
              | grep -E '^mobile-v[0-9]+\.[0-9]+\.0$' \
              | sort -V \
              | tail -n 1
          )"
          if [[ -z "$native_tag" ]]; then
            echo "::error::No native mobile-vX.Y.0 release exists. Merge the first mobile release-please PR and publish its TestFlight build before shipping OTA patches." >&2
            exit 1
          fi

          native_version="${native_tag#mobile-v}"
          IFS=. read -r major minor native_patch <<< "$native_version"
          if [[ "$native_patch" != "0" ]]; then
            echo "::error::Native release tag must end in .0, got $native_tag" >&2
            exit 1
          fi

          configured_version="$(node -e '
            const source = require("node:fs").readFileSync("apps/mobile/app.config.ts", "utf8");
            const match = source.match(/version:\s*["'\''`](\d+\.\d+\.\d+)["'\''`]\s*,\s*\/\/ x-release-please-version/);
            if (!match) throw new Error("cannot read release version from apps/mobile/app.config.ts");
            process.stdout.write(match[1]);
          ')"
          if [[ "$configured_version" != "$native_version" ]]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "OTA skipped: configured native line $configured_version is not published yet (latest published: $native_version)."
            exit 0
          fi

          if ! native_changes="$(node scripts/mobile-native-compatibility.mjs "$native_tag" HEAD)"; then
            echo "::error::Could not verify mobile native compatibility." >&2
            exit 1
          fi
          if [[ -n "$native_changes" ]]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "OTA waits for a native release: $native_changes" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "runtime=$native_version" >> "$GITHUB_OUTPUT"

      - name: Update Staging OTA Release Please PR
        if: steps.intent.outputs.mode == 'plan' && steps.version.outputs.blocked != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/mobile-ota-proposal.mjs plan "${{ steps.version.outputs.runtime }}"

      - name: Stage immutable candidate and update rolling promotion PR
        id: stage
        if: steps.intent.outputs.mode == 'stage' && steps.version.outputs.blocked != 'true'
        env:
          OTA_SOURCE_SHA: ${{ steps.intent.outputs.commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          STAGING_GOOGLE_AUTH_ID: ${{ secrets.STAGING_GOOGLE_AUTH_ID }}
          GOOGLE_AUTH_ID: ${{ vars.GOOGLE_AUTH_ID || '340053543157-ohufghcdnc5do2lkjg7cgnkk67oac0e7.apps.googleusercontent.com' }}
        run: node scripts/mobile-ota-release.ts stage "${{ steps.version.outputs.runtime }}" "${{ steps.intent.outputs.version }}"

      - name: Record the delivered Staging release
        if: steps.intent.outputs.mode == 'stage' && steps.version.outputs.blocked != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/mobile-ota-proposal.mjs complete "${{ steps.intent.outputs.pr }}" "${{ steps.stage.outputs.deferred }}"
