name: Reclaim GitHub-hosted runner disk
description: Remove unused hosted-image SDKs and enforce a free-space floor

inputs:
  minimum-free-gib:
    description: Minimum free GiB required after cleanup
    required: true

runs:
  using: composite
  steps:
    - name: Remove unused SDKs
      shell: bash
      env:
        RUNNER_KIND: ${{ runner.environment }}
        MINIMUM_FREE_GIB: ${{ inputs.minimum-free-gib }}
      run: |
        set -euo pipefail
        if [[ "$RUNNER_KIND" != github-hosted ]]; then
          echo '::error::Disk reclamation is restricted to disposable GitHub-hosted runners.' >&2
          exit 1
        fi
        if [[ ! "$MINIMUM_FREE_GIB" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::Invalid minimum-free-gib: $MINIMUM_FREE_GIB" >&2
          exit 1
        fi

        free_mib() {
          df --output=avail --block-size=1M "$RUNNER_TEMP" | tail -1 | tr -dc '0-9'
        }
        echo 'Disk usage before hosted-image cleanup:'
        df -h "$RUNNER_TEMP"
        # The floor is the whole contract. Deleting the SDKs takes over two
        # minutes on the critical path of every job that calls this, and hosted
        # images have so far arrived with roughly three times the floor free, so
        # only pay for the deletion when the floor is actually not met.
        if (( $(free_mib) >= MINIMUM_FREE_GIB * 1024 )); then
          echo "$(( $(free_mib) / 1024 )) GiB already free; floor of ${MINIMUM_FREE_GIB} GiB met, skipping cleanup"
          exit 0
        fi

        # Exact image-owned paths only. Never accept caller-provided deletion paths.
        sudo rm -rf -- \
          /usr/local/lib/android \
          /usr/share/dotnet \
          /opt/ghc \
          /usr/local/.ghcup \
          /opt/hostedtoolcache/CodeQL

        echo 'Disk usage after hosted-image cleanup:'
        df -h "$RUNNER_TEMP"
        avail_mib="$(free_mib)"
        echo "$((avail_mib / 1024)) GiB free on the filesystem holding \$RUNNER_TEMP"
        if (( avail_mib < MINIMUM_FREE_GIB * 1024 )); then
          echo "::error::Only $((avail_mib / 1024)) GiB free; need ${MINIMUM_FREE_GIB} GiB." >&2
          exit 1
        fi
