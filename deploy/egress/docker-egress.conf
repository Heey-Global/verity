# Experimental Docker drop-in; not installed by verity-install.
[Unit]
Requires=verity-egress-bootstrap.service
After=verity-egress-bootstrap.service
Upholds=verity-egress-host.service
Wants=verity-egress-host.service

[Service]
# RemainAfterExit bootstrap is a boot prerequisite, not an every-start fence.
# After= on the controller orders its complete stop before this start command.
ExecStartPre=/usr/bin/flock --exclusive --nonblock /var/lib/verity-egress/service.lock /usr/bin/node /opt/verity-egress/project-egress-host-main.mjs restore
