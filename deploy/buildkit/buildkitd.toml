# The socket grants build authority. Mount it only into the trusted Server.
root = "/var/lib/verity-buildkit"
insecure-entitlements = []

[grpc]
  address = ["unix:///run/verity-buildkit/buildkitd.sock"]
  uid = 0
  gid = 1102

[worker.oci]
  enabled = true
  # Each RUN step gets its own network namespace on a NATed host bridge. The
  # host-network default leaves runsc's sandbox network with no interface, so
  # no step could resolve or reach anything. network.sh writes the CNI config
  # and chooses a subnet that does not overlap this host's routes.
  networkMode = "cni"
  cniConfigPath = "/etc/verity-buildkit/cni.conflist"
  cniBinaryPath = "/usr/local/libexec/verity-buildkit/cni"
  # No pre-created namespaces: each step gets a fresh one, and none (with its
  # NAT and forwarding rules) lingers between builds.
  binary = "/usr/local/libexec/verity-buildkit/runsc"
  snapshotter = "native"
  max-parallelism = 1
  noProcessSandbox = false
  gc = true
  reservedSpace = "1GB"
  maxUsedSpace = "10GB"
  minFreeSpace = "5GB"

[worker.containerd]
  enabled = false
